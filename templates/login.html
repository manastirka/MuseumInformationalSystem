{% extends "base.html" %}

{% block title %}Пријава - Информациони систем Природњачког музеја{% endblock %}

{% block body_class %}heritage-shell login-page{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/strane/login.css') }}?v={{ v_statike('css/strane/login.css') }}">

<div class="login-container">
    <div class="login-wrapper">
        <!-- Login Card -->
        <div class="login-card">
            <!-- Header -->
            <div class="login-header">
                <div class="login-icon">
                    <img src="{{ url_for('static', filename='images/logotransparent.png') }}" alt="Лого" height="140" style="filter: brightness(0) invert(1) drop-shadow(0 0 2px #d4a843) drop-shadow(0 0 1px #d4a843);">
                </div>
                <h2 class="h4 mb-2">Природњачки музеј</h2>
                <p class="mb-0">Информациони систем</p>
            </div>

            <!-- Body -->
            <div class="login-body">
                <form method="POST" action="{{ url_for('login') }}" id="loginForm" data-testid="login-form" autocomplete="on">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

                    <!-- Email Field -->
                    <div class="form-floating-custom">
                        <label for="email">Емејл адреса</label>
                        <div class="position-relative">
                            <input type="email"
                                   class="form-control"
                                   id="email"
                                   name="email"
                                   data-testid="login-email"
                                   required
                                   autocomplete="username"
                                   inputmode="email"
                                   autocapitalize="none"
                                   spellcheck="false"
                                   placeholder="Унесите Ваш емејл"
                                   autofocus>
                            <i class="bi bi-envelope form-icon"></i>
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div class="form-floating-custom">
                        <label for="password">Лозинка</label>
                        <div class="position-relative">
                            <input type="password"
                                   class="form-control"
                                   id="password"
                                   name="password"
                                   data-testid="login-password"
                                   required
                                   autocomplete="current-password"
                                   placeholder="Унесите Вашу лозинку"
                                   style="padding-right: 3rem;">
                            <i class="bi bi-lock form-icon"></i>
                            <button type="button"
                                    class="password-toggle"
                                    id="passwordToggle"
                                    title="Прикажи лозинку">
                                <i class="bi bi-eye" id="passwordToggleIcon"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <div class="d-grid mb-4">
                        <button type="submit"
                                class="btn btn-login"
                                id="loginSubmit"
                                data-testid="login-submit">
                            <span id="loginSubmitLabel">
                                <i class="bi bi-box-arrow-in-right me-2"></i>
                                Пријави се
                            </span>
                            <span id="loginSubmitLoading" class="d-none align-items-center justify-content-center">
                                <span class="spinner-border spinner-border-sm me-2" role="status"></span>
                                Пријављивање...
                            </span>
                        </button>
                    </div>
                </form>

                <!-- Back Link -->
                <div class="text-center">
                    <a href="{{ url_for('index') }}" class="back-link">
                        <i class="bi bi-arrow-left"></i>
                        Назад на почетну
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const passwordToggle = document.getElementById('passwordToggle');
    const passwordToggleIcon = document.getElementById('passwordToggleIcon');
    const submitButton = document.getElementById('loginSubmit');
    const submitLabel = document.getElementById('loginSubmitLabel');
    const submitLoading = document.getElementById('loginSubmitLoading');

    function updateSubmitState() {
        const hasCredentials = Boolean(emailInput.value && passwordInput.value);
        submitButton.disabled = !hasCredentials;
    }

    function setSubmittingState(isSubmitting) {
        submitButton.disabled = isSubmitting;
        submitLabel.classList.toggle('d-none', isSubmitting);
        submitLoading.classList.toggle('d-none', !isSubmitting);
        submitLoading.classList.toggle('d-flex', isSubmitting);
    }

    passwordToggle.addEventListener('click', function() {
        const showPassword = passwordInput.type === 'password';
        passwordInput.type = showPassword ? 'text' : 'password';
        passwordToggle.title = showPassword ? 'Сакриј лозинку' : 'Прикажи лозинку';
        passwordToggleIcon.className = showPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
    });

    emailInput.addEventListener('input', updateSubmitState);
    passwordInput.addEventListener('input', updateSubmitState);
    emailInput.addEventListener('change', updateSubmitState);
    passwordInput.addEventListener('change', updateSubmitState);

    form.addEventListener('submit', function(event) {
        updateSubmitState();
        if (!emailInput.value || !passwordInput.value) {
            event.preventDefault();
            return;
        }
        setSubmittingState(true);
    });

    updateSubmitState();
    requestAnimationFrame(updateSubmitState);
    setTimeout(updateSubmitState, 150);
    setTimeout(updateSubmitState, 500);

    if (!emailInput.value) {
        emailInput.focus();
    }
});
</script>
{% endblock %}
