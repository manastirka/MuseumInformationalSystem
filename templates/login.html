{% extends "base.html" %}

{% block title %}Пријава - Информациони систем Природњачког музеја{% endblock %}

{% block content %}
<div x-data="loginPage()" x-cloak>
<style>
.login-container {
    min-height: calc(100vh - 140px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    background-color: var(--bg-body);
}

.login-wrapper {
    width: 100%;
    max-width: 420px;
}

.login-card {
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-xl, 16px);
    box-shadow: var(--shadow-lg);
    overflow: hidden;
}

.login-header {
    background-color: var(--primary, #2d6a4f);
    padding: 2rem;
    text-align: center;
    color: #ffffff;
}

.login-header h2 {
    color: #ffffff;
    margin-bottom: 0.25rem;
    font-weight: 600;
}

.login-header p {
    color: rgba(255, 255, 255, 0.85);
    margin-bottom: 0;
}

.login-icon {
    width: 100px;
    height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1rem;
}

.login-icon img {
    max-width: 100%;
    max-height: 100%;
}

.login-body {
    padding: 2rem;
}

.form-floating-custom {
    position: relative;
    margin-bottom: 1.25rem;
}

.form-floating-custom label {
    font-weight: 500;
    color: var(--text-primary);
    margin-bottom: 0.375rem;
    display: block;
}

.form-floating-custom .form-control {
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md, 8px);
    padding: 0.75rem 1rem 0.75rem 2.75rem;
    font-size: 1rem;
    background-color: var(--bg-card);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.form-floating-custom .form-control:focus {
    border-color: var(--primary, #2d6a4f);
    box-shadow: 0 0 0 3px rgba(45, 106, 79, 0.15);
    outline: none;
}

.form-floating-custom .form-icon {
    position: absolute;
    left: 1rem;
    top: 2.5rem;
    color: var(--text-muted);
    font-size: 1.1rem;
    z-index: 10;
}

.form-floating-custom .form-control:focus + .form-icon {
    color: var(--primary, #2d6a4f);
}

.password-toggle {
    position: absolute;
    right: 1rem;
    top: 2.5rem;
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 0.25rem;
    z-index: 10;
}

.password-toggle:hover {
    color: var(--primary, #2d6a4f);
}

.btn-login {
    background-color: var(--primary, #2d6a4f);
    border: none;
    color: #ffffff;
    font-weight: 600;
    padding: 0.875rem 1.5rem;
    width: 100%;
    border-radius: var(--radius-md, 8px);
    transition: background-color 0.2s ease;
}

.btn-login:hover {
    background-color: var(--primary-dark, #1b4332);
    color: #ffffff;
}

.btn-login:disabled {
    opacity: 0.65;
    cursor: not-allowed;
}

.back-link {
    display: inline-flex;
    align-items: center;
    color: var(--text-secondary);
    text-decoration: none;
    font-weight: 500;
    transition: color 0.2s ease;
}

.back-link:hover {
    color: var(--primary, #2d6a4f);
}

.back-link i {
    margin-right: 0.5rem;
}

/* Dark mode adjustments */
[data-theme="dark"] .login-card {
    background-color: var(--bg-card);
    border-color: var(--border-color);
}

[data-theme="dark"] .login-body {
    background-color: var(--bg-card);
}

[data-theme="dark"] .form-floating-custom .form-control {
    background-color: var(--gray-100, #374151);
    border-color: var(--border-color);
    color: var(--text-primary);
}

[data-theme="dark"] .form-floating-custom .form-control:focus {
    background-color: var(--gray-50, #1f2937);
    border-color: var(--primary);
}

[data-theme="dark"] .form-floating-custom label {
    color: var(--text-primary);
}

/* Alpine.js */
[x-cloak] {
    display: none !important;
}
</style>

<div class="login-container">
    <div class="login-wrapper">
        <!-- Login Card -->
        <div class="login-card">
            <!-- Header -->
            <div class="login-header">
                <div class="login-icon">
                    <img src="{{ url_for('static', filename='images/logotransparent.png') }}" alt="Лого" height="140" style="filter: brightness(0) invert(1) drop-shadow(0 0 2px #d4a843) drop-shadow(0 0 1px #d4a843);">
                </div>
                <h2 class="h4 mb-2">Природњачки музеј</h2>
                <p class="mb-0">Информациони систем</p>
            </div>

            <!-- Body -->
            <div class="login-body">
                <form method="POST" action="{{ url_for('login') }}" @submit="handleSubmit($event)">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

                    <!-- Email Field -->
                    <div class="form-floating-custom">
                        <label for="email">Емејл адреса</label>
                        <div class="position-relative">
                            <input type="text"
                                   class="form-control"
                                   id="email"
                                   name="email"
                                   required
                                   autocomplete="email"
                                   placeholder="Унесите Ваш емејл"
                                   x-model="email"
                                   autofocus>
                            <i class="bi bi-envelope form-icon"></i>
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div class="form-floating-custom">
                        <label for="password">Лозинка</label>
                        <div class="position-relative">
                            <input :type="showPassword ? 'text' : 'password'"
                                   class="form-control"
                                   id="password"
                                   name="password"
                                   required
                                   autocomplete="current-password"
                                   placeholder="Унесите Вашу лозинку"
                                   x-model="password"
                                   style="padding-right: 3rem;">
                            <i class="bi bi-lock form-icon"></i>
                            <button type="button"
                                    class="password-toggle"
                                    @click="showPassword = !showPassword"
                                    :title="showPassword ? 'Сакриј лозинку' : 'Прикажи лозинку'">
                                <i class="bi" :class="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <div class="d-grid mb-4">
                        <button type="submit"
                                class="btn btn-login"
                                :disabled="isLoading || !email || !password">
                            <span x-show="!isLoading">
                                <i class="bi bi-box-arrow-in-right me-2"></i>
                                Пријави се
                            </span>
                            <span x-show="isLoading" class="d-flex align-items-center justify-content-center">
                                <span class="spinner-border spinner-border-sm me-2" role="status"></span>
                                Пријављивање...
                            </span>
                        </button>
                    </div>
                </form>

                <!-- Back Link -->
                <div class="text-center">
                    <a href="{{ url_for('index') }}" class="back-link">
                        <i class="bi bi-arrow-left"></i>
                        Назад на почетну
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

</div><!-- End Alpine x-data wrapper -->

<script>
// Alpine.js Login Page Component
function loginPage() {
    return {
        email: '',
        password: '',
        showPassword: false,
        isLoading: false,

        init() {
            this.$nextTick(() => {
                document.getElementById('email').focus();
            });
        },

        handleSubmit(event) {
            if (!this.email || !this.password) {
                event.preventDefault();
                return;
            }
            this.isLoading = true;
        }
    };
}
</script>
{% endblock %}
