{% endblock %}

{% block scripts %}
<script>
function mailClient() {
    return {
        // State
        folders: [],
        folderUnreadTotal: 0,
        messages: [],
        selectedMessage: null,
        selectedUid: null,
        multiSelectMode: false,
        selectedUids: [],
        _longPressTimer: null,
        _longPressTriggered: false,
        currentFolder: 'INBOX',
        currentPage: 1,
        totalPages: 1,
        loading: false,
        settingsConfigured: true,
        searchQuery: '',
        messageCache: {},
        loadingMessage: false,

        // Tabs
        openTabs: [],       // [{uid, folder, subject, from_name, date, wasUnread, message}]
        openTabKeys: {},
        activeTabUid: null,
        maxTabs: 20,
        tabsOverflow: false,
        tabDragIndex: -1,
        tabContextMenu: { visible: false, x: 0, y: 0, uid: null },
        messageContextMenu: { visible: false, x: 0, y: 0, message: null },

        // Sort
        sortBy: 'date',
        sortDir: 'desc',

        // Compose
        composeOpen: false,
        composeMode: 'new',
        composeTo: '',
        composeCc: '',
        composeSubject: '',
        composeBody: '',
        composeFiles: [],
        sending: false,

        // Contacts
        contacts: [],
        contactsLoaded: false,
        contactSearch: '',
        showContactPicker: false,
        contactTarget: 'to',  // 'to' or 'cc'

        // Toast
        toastMsg: '',
        toastType: 'success',

        // Sync
        syncing: false,
        _pollInterval: null,
        _syncTimer: null,
        _tabsRestored: false,
        _loadToken: 0,
        folderWarmupPoll: null,
        folderWarmupActive: false,

        readerSectionDefaults() {
            return {
                header: false,
                security: false,
                links: false,
            };
        },

        createReaderSections(existing = null) {
            return {
                ...this.readerSectionDefaults(),
                ...(existing || {}),
            };
        },

        createTabEntry({ uid, folder, subject, from_name, date, wasUnread = false, message = null, readerSections = null }) {
            return {
                uid,
                folder,
                subject,
                from_name,
                date,
                wasUnread,
                message,
                readerSections: this.createReaderSections(readerSections),
            };
        },

        init() {
            // Restore tabs FIRST, before any async work
            this.restoreTabState();
            this._tabsRestored = true;

            this.loadInit();
            this.loadContacts();

            // Re-read cached data every 3 min (bg thread keeps cache fresh)
            this._pollInterval = setInterval(() => this.pollRefresh(), 180000);
            // Check tab overflow on window resize
            this._resizeObserver = new ResizeObserver(() => this.checkTabsOverflow());
            this.$nextTick(() => {
                if (this.$refs.tabList) this._resizeObserver.observe(this.$refs.tabList);
            });

            // Save tab state before leaving page (navigation, refresh, close)
            this._beforeUnload = () => this.saveTabState();
            window.addEventListener('beforeunload', this._beforeUnload);

            // Handle browser back/forward cache (bfcache)
            this._pageShow = (e) => {
                if (e.persisted) {
                    this._tabsRestored = false;
                    this.restoreTabState();
                    this._tabsRestored = true;
                }
            };
            window.addEventListener('pageshow', this._pageShow);
        },

        async loadContacts() {
            try {
                const r = await fetch('/api/mail/contacts');
                const d = await r.json();
                if (d.success) {
                    this.contacts = d.contacts;
                    this.contactsLoaded = true;
                }
            } catch (e) { /* ignore */ }
        },

        get filteredContacts() {
            if (!this.contactSearch.trim()) return this.contacts;
            const q = this.contactSearch.toLowerCase();
            return this.contacts.filter(c =>
                c.name.toLowerCase().includes(q) ||
                c.email.toLowerCase().includes(q) ||
                c.department.toLowerCase().includes(q)
            );
        },

        async fetchWithTimeout(url, options = {}, timeoutMs = 8000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
                return await fetch(url, { ...options, signal: controller.signal });
            } finally {
                clearTimeout(timer);
            }
        },

        handleEscape() {
            if (this.multiSelectMode) {
                this.exitMultiSelect();
                return;
            }
            this.composeOpen = false;
            this.showContactPicker = false;
            this.tabContextMenu.visible = false;
            this.messageContextMenu.visible = false;
        },

        clearFolderWarmupPoll() {
            if (this.folderWarmupPoll) {
                clearTimeout(this.folderWarmupPoll);
                this.folderWarmupPoll = null;
            }
            this.folderWarmupActive = false;
        },

        scheduleFolderWarmup(folder, attempt = 0) {
            this.clearFolderWarmupPoll();
            if (this.currentFolder !== folder) return;
            if (attempt >= 20) return;
            this.folderWarmupActive = true;
            this.folderWarmupPoll = setTimeout(async () => {
                if (this.currentFolder !== folder) return;
                await this.loadMessages();
                if (this.currentFolder !== folder) return;
                const stillEmpty = this.messages.length === 0;
                const stillLoading = this.loading;
                if (stillEmpty || stillLoading) {
                    this.scheduleFolderWarmup(folder, attempt + 1);
                } else {
                    this.folderWarmupActive = false;
                }
            }, attempt < 5 ? 700 : 1200);
        },

        startLongPress(event, message) {
            if (this.multiSelectMode) return;
            this._longPressTriggered = false;
            this._longPressTimer = setTimeout(() => {
                this._longPressTriggered = true;
                this.enterMultiSelect(message);
                if (navigator.vibrate) navigator.vibrate(50);
            }, 500);
        },

        cancelLongPress() {
            if (this._longPressTimer) {
                clearTimeout(this._longPressTimer);
                this._longPressTimer = null;
            }
        },

        enterMultiSelect(message) {
            this.multiSelectMode = true;
            this.selectedUids = [message.uid];
        },

        exitMultiSelect() {
            this.multiSelectMode = false;
            this.selectedUids = [];
        },

        toggleMultiSelect(message) {
            const idx = this.selectedUids.indexOf(message.uid);
            if (idx === -1) {
                this.selectedUids.push(message.uid);
            } else {
                this.selectedUids.splice(idx, 1);
            }
            if (this.selectedUids.length === 0) {
                this.exitMultiSelect();
            }
        },

        selectAllMessages() {
            if (this.selectedUids.length === this.messages.length) {
                this.selectedUids = [];
            } else {
                this.selectedUids = this.messages.map(m => m.uid);
            }
        },

        async deleteMultiSelected() {
            if (this.selectedUids.length === 0) return;
            const uids = [...this.selectedUids];
            const folder = this.currentFolder;
            const uidSet = new Set(uids);
            for (const uid of uids) {
                this.closeMessageTab(uid, folder);
                delete this.messageCache[`${folder}:${uid}`];
            }
            this.messages = this.messages.filter(m => !uidSet.has(m.uid));
            this.exitMultiSelect();
            this.showToast(`Обрисано ${uids.length} порука.`, 'success');
            for (const uid of uids) {
                secureFetch('/api/mail/delete', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ uid, folder })
                }).catch(() => {});
            }
        },

        async archiveMultiSelected() {
            if (this.selectedUids.length === 0) return;
            const archiveFolder = this.findFolderByKind('archive');
            if (!archiveFolder) {
                this.showToast('Архивски фолдер није пронађен.', 'danger');
                return;
            }
            const uids = [...this.selectedUids];
            const folder = this.currentFolder;
            let archived = 0;
            for (const uid of uids) {
                try {
                    const r = await secureFetch('/api/mail/move', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ uid, src_folder: folder, dst_folder: archiveFolder })
                    });
                    const d = await r.json();
                    if (d.success) {
                        this.closeMessageTab(uid, folder);
                        delete this.messageCache[`${folder}:${uid}`];
                        archived++;
                    }
                } catch (e) { /* continue */ }
            }
            this.exitMultiSelect();
            await this.loadInit();
            this.showToast(`Архивирано ${archived} порука.`, 'success');
        },

        setFolders(folders) {
            this.folders = [...(folders || [])].sort((left, right) => this.compareFolders(left, right));
            this.folderUnreadTotal = this.folders.reduce((sum, folder) => sum + (folder.unseen || 0), 0);
        },

        compareFolders(left, right) {
            const leftName = (left?.name || '').trim();
            const rightName = (right?.name || '').trim();
            const leftRank = this.folderSortRank(leftName);
            const rightRank = this.folderSortRank(rightName);
            if (leftRank !== rightRank) {
                return leftRank - rightRank;
            }
            return this.folderDisplayName(leftName).localeCompare(
                this.folderDisplayName(rightName),
                'sr',
                { sensitivity: 'base' }
            );
        },

        folderSortRank(name) {
            const n = (name || '').toLowerCase();
            if (n === 'inbox' || n.includes('inbox') || n.includes('пристиг')) return 0;
            if (n.includes('sent') || n.includes('послат')) return 1;
            if (n.includes('draft') || n.includes('нацрт')) return 2;
            if (n.includes('archive') || n.includes('архив')) return 3;
            if (n.includes('spam') || n.includes('junk') || n.includes('нежељ')) return 4;
            if (n.includes('trash') || n.includes('deleted') || n.includes('смеће') || n.includes('smece')) return 5;
            return 100;
        },

        normalizeMessage(message, folder = this.currentFolder) {
            const fromName = message.from_name || message.from_address || '';
            const tabKey = `${folder}:${message.uid}`;
            return {
                ...message,
                _senderColor: this.avatarColor(fromName),
                _initials: this.initials(fromName),
                _dateLabel: this.formatDate(message.date),
                _isOpen: !!this.openTabKeys[tabKey],
            };
        },

        setMessages(messages, folder = this.currentFolder) {
            this.messages = (messages || []).map(message => this.normalizeMessage(message, folder));
        },

        refreshVisibleMessages() {
            this.messages = this.messages.map(message => this.normalizeMessage(message, this.currentFolder));
        },

        rebuildOpenTabKeys() {
            const next = {};
            for (const tab of this.openTabs) {
                next[`${tab.folder}:${tab.uid}`] = true;
            }
            this.openTabKeys = next;
            if (this.messages.length > 0) {
                this.refreshVisibleMessages();
            }
        },

        findCurrentMessage(uid) {
            return this.messages.find(message => message.uid === uid) || null;
        },

        openContactPicker(target) {
            this.contactTarget = target;
            this.contactSearch = '';
            this.showContactPicker = true;
            this.$nextTick(() => {
                if (this.$refs.contactSearchInput) this.$refs.contactSearchInput.focus();
            });
        },

        pickContact(contact) {
            const field = this.contactTarget === 'cc' ? 'composeCc' : 'composeTo';
            const current = this[field].trim();
            if (current && !current.endsWith(',')) {
                this[field] = current + ', ' + contact.email;
            } else {
                this[field] = current + contact.email;
            }
            this.showContactPicker = false;
        },

        async loadInit() {
            const token = ++this._loadToken;
            const folder = this.currentFolder;
            const page = this.currentPage;
            const search = this.searchQuery.trim();
            this.loading = true;
            try {
                let url = `/api/mail/init?folder=${encodeURIComponent(folder)}&page=${page}`;
                url += `&sort=${encodeURIComponent(this.sortBy)}&dir=${encodeURIComponent(this.sortDir)}`;
                if (search) url += `&search=${encodeURIComponent(search)}`;
                const r = await this.fetchWithTimeout(url);
                const d = await r.json();
                if (token !== this._loadToken) return;
                if (d.success) {
                    this.setFolders(d.folders);
                    this.setMessages(d.messages, folder);
                    this.totalPages = d.pages;
                    this.settingsConfigured = true;
                    if (folder === this.currentFolder && this.messages.length === 0) {
                        this.scheduleFolderWarmup(folder);
                    } else if (folder === this.currentFolder) {
                        this.clearFolderWarmupPoll();
                    }
                } else {
                    this.settingsConfigured = false;
                }
            } catch (e) {
                if (token === this._loadToken) {
                    this.settingsConfigured = true;
                    if (folder === this.currentFolder) {
                        this.scheduleFolderWarmup(folder);
                    }
                }
            } finally {
                if (token === this._loadToken) {
                    this.loading = false;
                }
            }
        },

        async loadMessages() {
            const token = ++this._loadToken;
            const folder = this.currentFolder;
            const page = this.currentPage;
            const search = this.searchQuery.trim();
            try {
                let url = `/api/mail/messages?folder=${encodeURIComponent(folder)}&page=${page}`;
                url += `&sort=${this.sortBy}&dir=${this.sortDir}`;
                if (search) url += `&search=${encodeURIComponent(search)}`;
                const r = await this.fetchWithTimeout(url);
                const d = await r.json();
                if (token !== this._loadToken) return;
                if (d.success) {
                    this.setMessages(d.messages, folder);
                    this.totalPages = d.pages;
                }
            } catch (e) { /* ignore */ }
        },

        refreshMessages() {
            if (this.syncing) return;
            this.syncing = true;
            // Safety: force spinner off after 4 seconds no matter what
            if (this._syncTimer) clearTimeout(this._syncTimer);
            this._syncTimer = setTimeout(() => { this.syncing = false; }, 4000);
            // Fire sync (non-blocking on server), then reload cache
            secureFetch('/api/mail/sync', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ folder: this.currentFolder })
            }).catch(() => {});
            // Show cached data now, reload fresh data after delay
            this.loadInit().finally(() => { this.syncing = false; });
            setTimeout(() => this.loadInit(), 3000);
        },

        syncFolderInBackground(folder) {
            secureFetch('/api/mail/sync', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ folder })
            }).catch(() => {});
        },

        pollRefresh() {
            if (document.hidden) return;
            this.loadInit();
        },

        setSort(field) {
            if (this.sortBy === field) {
                this.sortDir = this.sortDir === 'desc' ? 'asc' : 'desc';
            } else {
                this.sortBy = field;
                this.sortDir = field === 'sender' || field === 'subject' ? 'asc' : 'desc';
            }
            this.currentPage = 1;
            this.loadMessages();
        },

        sortLabel(field) {
            const labels = { date: 'Датум', sender: 'Пошиљалац', subject: 'Наслов', unread: 'Непрочитане' };
            return labels[field] || field;
        },

        sortIcon(field) {
            if (this.sortBy !== field) return 'bi-dash';
            return this.sortDir === 'asc' ? 'bi-sort-up' : 'bi-sort-down';
        },

        selectFolder(name) {
            this.clearFolderWarmupPoll();
            this.currentFolder = name;
            this.currentPage = 1;
            this.selectedUid = null;
            this.searchQuery = '';
            this.multiSelectMode = false;
            this.selectedUids = [];
            this.messageContextMenu.visible = false;
            this.loadMessages();
            this.syncFolderInBackground(name);
            this.scheduleFolderWarmup(name);
        },

        async selectMessage(m) {
            this.selectedUid = m.uid;
            // Check if tab already open
            const existing = this.openTabs.find(t => t.uid === m.uid && t.folder === this.currentFolder);
            if (existing) {
                this.activeTabUid = m.uid;
                this.selectedMessage = existing.message;
                this.scrollToActiveTab();
                return;
            }
            // Enforce tab limit
            if (this.openTabs.length >= this.maxTabs) {
                // Close oldest non-active tab
                const oldest = this.openTabs.find(t => t.uid !== this.activeTabUid);
                if (oldest) this.closeTab(oldest.uid);
                else {
                    this.showToast(`Максимум ${this.maxTabs} отворених порука.`, 'danger');
                    return;
                }
            }
            const wasUnread = !m.is_read;
            const cacheKey = this.currentFolder + ':' + m.uid;
            if (this.messageCache[cacheKey]) {
                const msg = this.messageCache[cacheKey];
                this.openTabs.push(this.createTabEntry({
                    uid: m.uid,
                    folder: this.currentFolder,
                    subject: m.subject,
                    from_name: m.from_name,
                    date: m.date,
                    wasUnread,
                    message: msg
                }));
                this.rebuildOpenTabKeys();
                this.activeTabUid = m.uid;
                this.selectedMessage = msg;
                m.is_read = true;
                Object.assign(m, this.normalizeMessage(m, this.currentFolder));
                this.saveTabState();
                this.$nextTick(() => { this.checkTabsOverflow(); this.scrollToActiveTab(); });
                return;
            }
            this.loadingMessage = true;
            this.selectedMessage = null;
            this.activeTabUid = m.uid;
            try {
                const r = await fetch(`/api/mail/message/${m.uid}?folder=${encodeURIComponent(this.currentFolder)}`);
                const d = await r.json();
                if (d.success) {
                    this.messageCache[cacheKey] = d.message;
                    this.openTabs.push(this.createTabEntry({
                        uid: m.uid,
                        folder: this.currentFolder,
                        subject: d.message.subject || m.subject,
                        from_name: d.message.from_name || m.from_name,
                        date: d.message.date || m.date,
                        wasUnread,
                        message: d.message
                    }));
                    this.rebuildOpenTabKeys();
                    this.selectedMessage = d.message;
                    m.is_read = true;
                    Object.assign(m, this.normalizeMessage(m, this.currentFolder));
                    this.saveTabState();
                    this.$nextTick(() => { this.checkTabsOverflow(); this.scrollToActiveTab(); });
                }
            } catch (e) { /* ignore */ }
            this.loadingMessage = false;
        },

        get activeTabMessage() {
            if (!this.activeTabUid) return null;
            const tab = this.openTabs.find(t => t.uid === this.activeTabUid);
            return (tab && tab.message) ? tab.message : null;
        },

        get activeTab() {
            if (!this.activeTabUid) return null;
            return this.openTabs.find(t => t.uid === this.activeTabUid) || null;
        },

        get activeTabFolder() {
            if (!this.activeTabUid) return this.currentFolder;
            const tab = this.openTabs.find(t => t.uid === this.activeTabUid);
            return tab ? tab.folder : this.currentFolder;
        },

        isReaderSectionOpen(section) {
            return !!(this.activeTab && this.activeTab.readerSections && this.activeTab.readerSections[section]);
        },

        toggleReaderSection(section) {
            if (!this.activeTab) return;
            this.activeTab.readerSections = this.createReaderSections(this.activeTab.readerSections);
            this.activeTab.readerSections[section] = !this.activeTab.readerSections[section];
            this.saveTabState();
        },

        switchTab(uid) {
            this.activeTabUid = uid;
            const tab = this.openTabs.find(t => t.uid === uid);
            if (tab) {
                if (tab.message) {
                    this.selectedMessage = tab.message;
                    this.selectedUid = uid;
                } else {
                    // Restored tab without body — load it
                    this.loadRestoredTab(uid);
                }
                // Mark tab as read once viewed
                tab.wasUnread = false;
            }
            this.tabContextMenu.visible = false;
            this.messageContextMenu.visible = false;
            this.saveTabState();
            this.scrollToActiveTab();
        },

        closeTab(uid) {
            if (!uid) return;
            const idx = this.openTabs.findIndex(t => t.uid === uid);
            if (idx === -1) return;
            this.openTabs.splice(idx, 1);
            if (this.activeTabUid === uid) {
                if (this.openTabs.length === 0) {
                    this.activeTabUid = null;
                    this.selectedMessage = null;
                    this.selectedUid = null;
                } else {
                    const newIdx = Math.min(idx, this.openTabs.length - 1);
                    this.activeTabUid = this.openTabs[newIdx].uid;
                    this.selectedMessage = this.openTabs[newIdx].message;
                    this.selectedUid = this.openTabs[newIdx].uid;
                }
            }
            this.rebuildOpenTabKeys();
            this.saveTabState();
            this.$nextTick(() => this.checkTabsOverflow());
        },

        closeMessageTab(uid, folder) {
            const idx = this.openTabs.findIndex(tab => tab.uid === uid && tab.folder === folder);
            if (idx === -1) return;
            const isActiveTarget = this.activeTabUid === uid && this.activeTabFolder === folder;
            this.openTabs.splice(idx, 1);
            if (isActiveTarget) {
                if (this.openTabs.length === 0) {
                    this.activeTabUid = null;
                    this.selectedMessage = null;
                    this.selectedUid = null;
                } else {
                    const newIdx = Math.min(idx, this.openTabs.length - 1);
                    this.activeTabUid = this.openTabs[newIdx].uid;
                    this.selectedMessage = this.openTabs[newIdx].message;
                    this.selectedUid = this.openTabs[newIdx].uid;
                }
            }
            this.rebuildOpenTabKeys();
            this.saveTabState();
            this.$nextTick(() => this.checkTabsOverflow());
        },

        closeOtherTabs(uid) {
            const keep = this.openTabs.find(t => t.uid === uid);
            if (!keep) return;
            this.openTabs = [keep];
            this.activeTabUid = uid;
            this.selectedMessage = keep.message;
            this.selectedUid = uid;
            this.rebuildOpenTabKeys();
            this.saveTabState();
            this.$nextTick(() => this.checkTabsOverflow());
        },

        closeTabsToRight(uid) {
            const idx = this.openTabs.findIndex(t => t.uid === uid);
            if (idx === -1) return;
            const removed = this.openTabs.splice(idx + 1);
            // If active tab was removed, switch to the clicked tab
            if (removed.some(t => t.uid === this.activeTabUid)) {
                this.activeTabUid = uid;
                const tab = this.openTabs.find(t => t.uid === uid);
                if (tab) {
                    this.selectedMessage = tab.message;
                    this.selectedUid = uid;
                }
            }
            this.rebuildOpenTabKeys();
            this.saveTabState();
            this.$nextTick(() => this.checkTabsOverflow());
        },

        closeAllTabs() {
            this.openTabs = [];
            this.activeTabUid = null;
            this.selectedMessage = null;
            this.selectedUid = null;
            this.rebuildOpenTabKeys();
            this.saveTabState();
            this.$nextTick(() => this.checkTabsOverflow());
        },

        cycleTab(direction) {
            if (this.openTabs.length <= 1) return;
            const idx = this.openTabs.findIndex(t => t.uid === this.activeTabUid);
            let newIdx = idx + direction;
            if (newIdx < 0) newIdx = this.openTabs.length - 1;
            if (newIdx >= this.openTabs.length) newIdx = 0;
            this.switchTab(this.openTabs[newIdx].uid);
        },

        // Tab context menu
        openTabContextMenu(event, uid) {
            this.messageContextMenu.visible = false;
            this.tabContextMenu = {
                visible: true,
                x: event.clientX,
                y: event.clientY,
                uid: uid
            };
        },

        // Tab overflow scrolling
        checkTabsOverflow() {
            const el = this.$refs.tabList;
            if (!el) { this.tabsOverflow = false; return; }
            this.tabsOverflow = el.scrollWidth > el.clientWidth + 4;
        },

        scrollTabs(delta) {
            const el = this.$refs.tabList;
            if (el) el.scrollBy({ left: delta, behavior: 'smooth' });
        },

        scrollToActiveTab() {
            this.$nextTick(() => {
                const el = this.$refs.tabList;
                if (!el) return;
                const active = el.querySelector('.mail-tab.active');
                if (active) active.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
            });
        },

        // Tab drag-and-drop reorder
        onTabDragStart(event, index) {
            this.tabDragIndex = index;
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('text/plain', index);
        },

        onTabDragOver(event, index) {
            if (this.tabDragIndex === -1 || this.tabDragIndex === index) return;
            event.dataTransfer.dropEffect = 'move';
        },

        onTabDrop(event, toIndex) {
            const fromIndex = this.tabDragIndex;
            if (fromIndex === -1 || fromIndex === toIndex) return;
            const tab = this.openTabs.splice(fromIndex, 1)[0];
            this.openTabs.splice(toIndex, 0, tab);
            this.tabDragIndex = -1;
            this.rebuildOpenTabKeys();
            this.saveTabState();
        },

        // Persist tab state across page loads
        saveTabState() {
            // Don't save empty state before restore has completed
            if (!this._tabsRestored) return;
            try {
                const state = this.openTabs.map(t => ({
                    uid: t.uid, folder: t.folder, subject: t.subject,
                    from_name: t.from_name, date: t.date,
                    readerSections: this.createReaderSections(t.readerSections)
                }));
                localStorage.setItem('mail_open_tabs', JSON.stringify(state));
                localStorage.setItem('mail_active_tab', this.activeTabUid || '');
            } catch (e) { /* storage full or disabled */ }
        },

        restoreTabState() {
            try {
                const raw = localStorage.getItem('mail_open_tabs');
                const activeUid = localStorage.getItem('mail_active_tab');
                if (!raw) return;
                const saved = JSON.parse(raw);
                if (!Array.isArray(saved) || saved.length === 0) return;

                // Avoid duplicate restoration — skip if tabs already loaded
                if (this.openTabs.length > 0) return;

                // Restore tab stubs — validate each entry has required fields
                for (const t of saved) {
                    if (!t.uid || !t.folder) continue;
                    this.openTabs.push(this.createTabEntry({
                        uid: t.uid,
                        folder: t.folder,
                        subject: t.subject || '(нема наслова)',
                        from_name: t.from_name || '',
                        date: t.date || '',
                        wasUnread: false,
                        message: null,
                        readerSections: t.readerSections
                    }));
                }

                if (this.openTabs.length === 0) return;
                this.rebuildOpenTabKeys();

                // Restore active tab — fall back to first tab if saved active is gone
                if (activeUid && this.openTabs.some(t => t.uid === activeUid)) {
                    this.activeTabUid = activeUid;
                } else {
                    this.activeTabUid = this.openTabs[0].uid;
                }
                // Load the active tab's message content
                this.loadRestoredTab(this.activeTabUid);

                this.$nextTick(() => this.checkTabsOverflow());
            } catch (e) { /* ignore corrupt state */ }
        },

        async loadRestoredTab(uid) {
            const tab = this.openTabs.find(t => t.uid === uid);
            if (!tab || tab.message) return;
            const cacheKey = tab.folder + ':' + uid;
            if (this.messageCache[cacheKey]) {
                tab.message = this.messageCache[cacheKey];
                this.selectedMessage = tab.message;
                this.selectedUid = uid;
                return;
            }
            this.loadingMessage = true;
            try {
                const r = await fetch(`/api/mail/message/${uid}?folder=${encodeURIComponent(tab.folder)}`);
                const d = await r.json();
                if (d.success) {
                    this.messageCache[cacheKey] = d.message;
                    tab.message = d.message;
                    tab.subject = d.message.subject || tab.subject;
                    tab.from_name = d.message.from_name || tab.from_name;
                    if (this.activeTabUid === uid) {
                        this.selectedMessage = d.message;
                        this.selectedUid = uid;
                    }
                }
            } catch (e) { /* ignore */ }
            this.loadingMessage = false;
        },

        openMessageContextMenu(event, message) {
            this.tabContextMenu.visible = false;
            this.selectedUid = message.uid;
            this.messageContextMenu = {
                visible: true,
                x: event.clientX,
                y: event.clientY,
                message: { ...message, folder: this.currentFolder }
            };
        },

        closeMessageContextMenu() {
            this.messageContextMenu.visible = false;
        },

        async openMessageFromContextMenu() {
            const message = this.messageContextMenu.message;
            this.closeMessageContextMenu();
            if (!message) return;
            const row = this.findCurrentMessage(message.uid);
            if (row) {
                await this.selectMessage(row);
            }
        },

        async replyFromContextMenu() {
            await this.openMessageFromContextMenu();
            if (this.activeTabMessage) {
                this.openReply();
            }
        },

        async toggleReadFromContextMenu() {
            const message = this.messageContextMenu.message;
            this.closeMessageContextMenu();
            if (!message) return;
            await this.setReadState(message.uid, message.folder || this.currentFolder, !message.is_read);
        },

        async archiveFromContextMenu() {
            const message = this.messageContextMenu.message;
            this.closeMessageContextMenu();
            if (!message) return;
            await this.archiveMessage(message.uid, message.folder || this.currentFolder);
        },

        async deleteFromContextMenu() {
            const message = this.messageContextMenu.message;
            this.closeMessageContextMenu();
            if (!message) return;
            await this.deleteMessage(message.uid, message.folder || this.currentFolder);
        },

        searchMessages() {
            this.currentPage = 1;
            this.loadMessages();
        },

        goPage(p) {
            this.currentPage = p;
            this.loadMessages();
        },

        // Compose
        openCompose() {
            this.composeMode = 'new';
            this.composeTo = '';
            this.composeCc = '';
            this.composeSubject = '';
            this.composeBody = '';
            this.composeFiles = [];
            this.composeOpen = true;
        },

        openReply() {
            const msg = this.activeTabMessage;
            if (!msg) return;
            this.composeMode = 'reply';
            this.composeTo = msg.from_address;
            this.composeCc = '';
            this.composeFiles = [];
            const subj = msg.subject || '';
            this.composeSubject = subj.startsWith('Re:') ? subj : 'Re: ' + subj;
            const date = this.formatDateFull(msg.date);
            const from = msg.from_name || msg.from_address;
            const origBody = msg.text_body || '(HTML порука)';
            this.composeBody = `\n\n--- Оригинална порука ---\nДатум: ${date}\nОд: ${from}\n\n${origBody}`;
            this.composeOpen = true;
        },

        openForward() {
            const msg = this.activeTabMessage;
            if (!msg) return;
            this.composeMode = 'forward';
            this.composeTo = '';
            this.composeCc = '';
            this.composeFiles = [];
            const subj = msg.subject || '';
            this.composeSubject = subj.startsWith('Fwd:') ? subj : 'Fwd: ' + subj;
            const date = this.formatDateFull(msg.date);
            const from = msg.from_name || msg.from_address;
            const origBody = msg.text_body || '(HTML порука)';
            this.composeBody = `\n\n--- Прослеђена порука ---\nДатум: ${date}\nОд: ${from}\nНаслов: ${msg.subject}\n\n${origBody}`;
            this.composeOpen = true;
        },

        onComposeFileSelect(event) {
            const files = Array.from(event.target.files || []);
            for (const f of files) {
                this.composeFiles.push(f);
            }
            event.target.value = '';
        },

        removeComposeFile(index) {
            this.composeFiles.splice(index, 1);
        },

        composeTotalSize() {
            return this.composeFiles.reduce((sum, f) => sum + f.size, 0);
        },

        async sendCompose() {
            if (!this.composeTo.trim()) {
                this.showToast('Унесите адресу примаоца.', 'danger');
                return;
            }
            if (this.composeTotalSize() > 25 * 1024 * 1024) {
                this.showToast('Прилози су превелики (макс. 25MB укупно).', 'danger');
                return;
            }
            this.sending = true;
            try {
                let r;
                if (this.composeFiles.length > 0) {
                    const formData = new FormData();
                    formData.append('to', this.composeTo);
                    formData.append('cc', this.composeCc);
                    formData.append('subject', this.composeSubject);
                    formData.append('body', this.composeBody);
                    for (const f of this.composeFiles) {
                        formData.append('attachments', f);
                    }
                    r = await fetch('/api/mail/send', {
                        method: 'POST',
                        headers: {'X-CSRFToken': CSRF_TOKEN},
                        body: formData
                    });
                } else {
                    r = await secureFetch('/api/mail/send', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            to: this.composeTo,
                            cc: this.composeCc,
                            subject: this.composeSubject,
                            body: this.composeBody
                        })
                    });
                }
                const d = await r.json();
                if (d.success) {
                    this.showToast('Порука је послата.', 'success');
                    this.composeOpen = false;
                    this.composeFiles = [];
                } else {
                    this.showToast(d.message || 'Грешка при слању.', 'danger');
                }
            } catch (e) {
                this.showToast('Грешка при слању.', 'danger');
            }
            this.sending = false;
        },

        async deleteSelected() {
            if (!this.activeTabUid) return;
            await this.deleteMessage(this.activeTabUid, this.activeTabFolder);
        },

        async archiveSelected() {
            if (!this.activeTabUid) return;
            await this.archiveMessage(this.activeTabUid, this.activeTabFolder);
        },

        async moveSelected(dstFolder) {
            if (!this.activeTabUid) return;
            await this.moveMessage(this.activeTabUid, this.activeTabFolder, dstFolder);
        },

        async deleteMessage(uid, folder) {
            if (!uid) return;
            this.closeMessageTab(uid, folder);
            delete this.messageCache[`${folder}:${uid}`];
            this.messages = this.messages.filter(m => !(m.uid === uid && (m.folder || this.currentFolder) === folder));
            const fi = this.folders.find(f => f.name === folder);
            if (fi && fi.unseen > 0) fi.unseen = Math.max(0, fi.unseen - 1);
            this.showToast('Порука је обрисана.', 'success');
            secureFetch('/api/mail/delete', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ uid, folder })
            }).catch(() => {});
        },

        async moveMessage(uid, srcFolder, dstFolder, successMessage = 'Порука је премештена.') {
            if (!uid || !dstFolder || dstFolder === srcFolder) return;
            try {
                const r = await secureFetch('/api/mail/move', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        uid: uid,
                        src_folder: srcFolder,
                        dst_folder: dstFolder
                    })
                });
                const d = await r.json();
                if (d.success) {
                    this.closeMessageTab(uid, srcFolder);
                    delete this.messageCache[`${srcFolder}:${uid}`];
                    await this.loadInit();
                    this.showToast(successMessage, 'success');
                } else {
                    this.showToast(d.message || 'Грешка при премештању.', 'danger');
                }
            } catch (e) {
                this.showToast('Грешка при премештању.', 'danger');
            }
        },

        async setReadState(uid, folder, isRead) {
            if (!uid) return;
            try {
                const r = await secureFetch('/api/mail/read-state', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ uid, folder, is_read: isRead })
                });
                const d = await r.json();
                if (!d.success) {
                    this.showToast(d.message || 'Грешка при промени статуса.', 'danger');
                    return;
                }

                const row = this.findCurrentMessage(uid);
                if (row) {
                    row.is_read = isRead;
                    Object.assign(row, this.normalizeMessage(row, folder));
                }

                const cacheKey = `${folder}:${uid}`;
                if (this.messageCache[cacheKey]) {
                    this.messageCache[cacheKey].is_read = isRead;
                }

                const tab = this.openTabs.find(item => item.uid === uid && item.folder === folder);
                if (tab) {
                    tab.wasUnread = !isRead;
                }

                const folderRow = this.folders.find(item => item.name === folder);
                if (folderRow) {
                    const delta = isRead ? -1 : 1;
                    folderRow.unseen = Math.max(0, (folderRow.unseen || 0) + delta);
                    this.folderUnreadTotal = this.folders.reduce((sum, item) => sum + (item.unseen || 0), 0);
                }

                this.showToast(isRead ? 'Порука је означена као прочитана.' : 'Порука је означена као непрочитана.', 'success');
            } catch (e) {
                this.showToast('Грешка при промени статуса.', 'danger');
            }
        },

        findFolderByKind(kind) {
            const patterns = {
                archive: [/^archive$/i, /archive/i, /архив/i],
                trash: [/^trash$/i, /trash/i, /deleted/i, /смеће/i, /smece/i],
            };
            const matchers = patterns[kind] || [];
            const folder = this.folders.find(item => matchers.some(pattern => pattern.test(item.name)));
            return folder ? folder.name : null;
        },

        async archiveMessage(uid, folder) {
            const archiveFolder = this.findFolderByKind('archive');
            if (!archiveFolder) {
                this.showToast('Архивски фолдер није пронађен.', 'danger');
                return;
            }
            await this.moveMessage(uid, folder, archiveFolder, 'Порука је архивирана.');
        },

        // Helpers
        folderIcon(name) {
            const n = name.toLowerCase();
            if (n === 'inbox' || n.includes('inbox')) return 'bi-inbox-fill';
            if (n.includes('sent') || n.includes('послат')) return 'bi-send-fill';
            if (n.includes('draft') || n.includes('нацрт')) return 'bi-pencil-fill';
            if (n.includes('trash') || n.includes('смеће') || n.includes('deleted')) return 'bi-trash-fill';
            if (n.includes('spam') || n.includes('junk')) return 'bi-exclamation-triangle-fill';
            if (n.includes('archive') || n.includes('архив')) return 'bi-archive-fill';
            return 'bi-folder-fill';
        },

        folderColorClass(name) {
            const n = name.toLowerCase();
            if (n === 'inbox' || n.includes('inbox')) return 'blue';
            if (n.includes('sent') || n.includes('послат')) return 'teal';
            if (n.includes('draft') || n.includes('нацрт')) return 'amber';
            if (n.includes('trash') || n.includes('смеће') || n.includes('deleted')) return 'red';
            if (n.includes('spam') || n.includes('junk')) return 'orange';
            if (n.includes('archive') || n.includes('архив')) return 'purple';
            return 'gray';
        },

        folderDisplayName(name) {
            const map = {
                'INBOX': 'Пристигле',
                'Sent': 'Послате',
                'Drafts': 'Нацрти',
                'Trash': 'Смеће',
                'Junk': 'Нежељена',
                'Spam': 'Нежељена',
                'Archive': 'Архива',
            };
            return map[name] || name;
        },

        initials(name) {
            if (!name) return '?';
            const parts = name.trim().split(/\s+/);
            if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
            return name.substring(0, 2).toUpperCase();
        },

        avatarColor(name) {
            if (!name) return '#6c757d';
            let hash = 0;
            for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
            const colors = ['#4e79a7','#f28e2b','#e15759','#76b7b2','#59a14f','#edc948','#b07aa1','#ff9da7','#9c755f','#bab0ac'];
            return colors[Math.abs(hash) % colors.length];
        },

        formatDate(iso) {
            if (!iso) return '';
            try {
                const d = new Date(iso);
                const now = new Date();
                if (d.toDateString() === now.toDateString()) {
                    return d.toLocaleTimeString('sr-RS', {hour: '2-digit', minute: '2-digit'});
                }
                return d.toLocaleDateString('sr-RS', {day: '2-digit', month: '2-digit'});
            } catch (e) { return iso; }
        },

        formatDateFull(iso) {
            if (!iso) return '';
            try {
                return new Date(iso).toLocaleString('sr-RS', {
                    day: '2-digit', month: 'long', year: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                });
            } catch (e) { return iso; }
        },

        formatSize(bytes) {
            if (!bytes) return '';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1048576).toFixed(1) + ' MB';
        },

        recipientCountLabel(message) {
            const toCount = Array.isArray(message?.to) ? message.to.length : 0;
            const ccCount = Array.isArray(message?.cc) ? message.cc.length : 0;
            return `Примаоци ${toCount + ccCount}`;
        },

        attachmentCountLabel(message) {
            const count = Array.isArray(message?.attachments) ? message.attachments.length : 0;
            return `Прилози ${count}`;
        },

        linkCountLabel(links) {
            const count = Array.isArray(links) ? links.length : 0;
            return `Линкови ${count}`;
        },

        handleBodyLinkClick(event) {
            const link = event.target.closest('a.mail-safe-link');
            if (!link) return;
            event.preventDefault();
            const encoded = link.getAttribute('data-link');
            if (!encoded) return;
            this.confirmOpenLink(decodeURIComponent(encoded));
        },

        confirmOpenLink(url) {
            if (!url) return;
            let host = url;
            try {
                const parsed = new URL(url);
                host = parsed.hostname || parsed.protocol;
            } catch (e) { /* keep raw url */ }

            const ok = window.confirm(
                `Отварате спољни линк.\n\nДомен: ${host}\n\nURL:\n${url}\n\nОтвори у новом прозору?`
            );
            if (ok) {
                window.open(url, '_blank', 'noopener,noreferrer');
            }
        },

        linkReasonText(reasons) {
            if (!Array.isArray(reasons) || reasons.length === 0) {
                return 'Линк није означен као сумњив.';
            }
            const labels = {
                unsupported_scheme: 'Неподржана шема линка',
                ip_host: 'Линк користи IP адресу уместо домена',
                punycode_host: 'Домен садржи punycode',
                external_login_page: 'Линк личи на спољну страницу за пријаву',
                internal_sender_external_link: 'Интерни пошиљалац води на спољни домен',
                insecure_http: 'Линк није HTTPS',
                label_domain_mismatch: 'Текст линка и стварни домен се не поклапају',
            };
            return reasons.map(reason => labels[reason] || reason).join(' • ');
        },

        handleAttachmentClick(event, attachment) {
            const link = event.currentTarget;
            if (!link) return;
            const url = link.href;
            if (!url) return;
            if (!attachment || !attachment.dangerous) {
                window.location.href = url;
                return;
            }
            const ok = window.confirm(
                `Овај прилог је означен као потенцијално ризичан.\n\nФајл: ${attachment.filename || 'непознато'}\n\nПреузети ипак?`
            );
            if (ok) {
                window.location.href = url;
            }
        },

        handleAttachmentBundleClick(event) {
            const link = event.currentTarget;
            if (!link) return;
            const url = link.href;
            if (!url) return;
            const dangerous = (this.activeTabMessage?.security?.dangerous_attachments || []).length;
            if (dangerous > 0) {
                const ok = window.confirm(
                    `Ова порука садржи ${dangerous} ризичних прилога.\n\nПреузети ZIP пакет ипак?`
                );
                if (!ok) return;
            }
            window.location.href = url;
        },

        linkifyText(text) {
            if (!text) return '';
            // Escape HTML first, then convert URLs to clickable links
            const escaped = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
            return escaped.replace(/(https?:\/\/[^\s<]+)/g, (match) => {
                const clean = match.replace(/[).,;!?]+$/, '');
                const encoded = encodeURIComponent(clean);
                return `<a href="#" class="mail-safe-link" data-link="${encoded}" rel="nofollow">${clean}</a>`;
            });
        },

        showToast(msg, type) {
            this.toastMsg = msg;
            this.toastType = type;
            const el = this.$refs.toast;
            if (el) {
                const t = bootstrap.Toast.getOrCreateInstance(el);
                t.show();
            }
        },

        destroy() {
            // Save tab state one last time on teardown
            this.saveTabState();
            this.clearFolderWarmupPoll();
            if (this._pollInterval) clearInterval(this._pollInterval);
