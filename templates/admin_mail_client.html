{% extends "base.html" %}
{% block title %}Електронска пошта — Природњачки музеј{% endblock %}

{% block content %}
<div x-data="mailClient()" x-init="init()" class="mail-app" @keydown.escape.window="handleEscape()">
    <!-- Toolbar -->
    <div class="mail-toolbar">
        <div class="d-flex align-items-center gap-2 flex-wrap">
            <button class="btn btn-primary btn-sm" @click="openCompose()">
                <i class="bi bi-pencil-square me-1"></i>Нова порука
            </button>
            <button class="btn btn-outline-secondary btn-sm" @click="refreshMessages()" :disabled="syncing">
                <i class="bi bi-arrow-clockwise me-1" :class="{'spin': syncing}"></i>Освежи
            </button>
            <div class="input-group input-group-sm" style="max-width:260px">
                <input type="text" class="form-control" placeholder="Претрага..." x-model="searchQuery"
                       @keydown.enter="searchMessages()">
                <button class="btn btn-outline-secondary" @click="searchMessages()">
                    <i class="bi bi-search"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Three pane layout -->
    <div class="mail-layout">
        <!-- Folder pane -->
        <div class="mail-folders">
            <div class="folder-brand">
                <div class="folder-brand-icon">
                    <i class="bi bi-envelope-fill"></i>
                </div>
                <div class="folder-brand-text">
                    <div class="folder-brand-title">Пошта</div>
                    <div class="folder-brand-sub" x-text="folderUnreadTotal + ' непрочитаних'"></div>
                </div>
            </div>
            <template x-if="!settingsConfigured">
                <div class="p-3 text-muted small">
                    <i class="bi bi-info-circle me-1"></i>
                    Подешавања поште одржава администрација.
                </div>
            </template>
            <div class="folder-section-label">Фолдери</div>
            <div class="folder-list">
                <template x-for="f in folders" :key="f.name">
                    <div class="folder-item" :class="{'active': currentFolder === f.name}"
                         @click="selectFolder(f.name)">
                        <div class="folder-icon-wrap" :class="'folder-icon-' + folderColorClass(f.name)">
                            <i class="bi" :class="folderIcon(f.name)"></i>
                        </div>
                        <span class="folder-name" x-text="folderDisplayName(f.name)"></span>
                        <span class="folder-badge" x-show="f.unseen > 0" x-text="f.unseen"></span>
                    </div>
                </template>
            </div>
        </div>

        <!-- Message list pane -->
        <div class="mail-list">
            <!-- Sort bar -->
            <div class="mail-sort-bar">
                <template x-for="s in ['date','sender','subject','unread']" :key="s">
                    <button class="mail-sort-btn" :class="{'active': sortBy === s}" @click="setSort(s)">
                        <span x-text="sortLabel(s)"></span>
                        <i class="bi" :class="sortIcon(s)" x-show="sortBy === s"></i>
                    </button>
                </template>
            </div>
            <!-- Multi-select toolbar -->
            <div class="multi-select-bar" x-show="multiSelectMode"
                 x-transition:enter="transition ease-out duration-200"
                 x-transition:enter-start="opacity-0 transform -translate-y-2"
                 x-transition:enter-end="opacity-100 transform translate-y-0">
                <div class="msel-count" x-text="selectedUids.length + ' изабрано'"></div>
                <div class="msel-actions">
                    <button class="msel-btn msel-btn-select" @click="selectAllMessages()" title="Изабери све">
                        <i class="bi" :class="selectedUids.length === messages.length ? 'bi-dash-square' : 'bi-check2-square'"></i>Све
                    </button>
                    <button class="msel-btn msel-btn-delete" :disabled="selectedUids.length === 0" @click="deleteMultiSelected()" title="Обриши">
                        <i class="bi bi-trash3"></i>
                    </button>
                    <button class="msel-btn msel-btn-archive" :disabled="selectedUids.length === 0" @click="archiveMultiSelected()" title="Архивирај">
                        <i class="bi bi-archive"></i>
                    </button>
                    <button class="msel-btn msel-btn-cancel" @click="exitMultiSelect()" title="Откажи">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>
            </div>
            <template x-if="loading && messages.length === 0">
                <div class="text-center p-4 text-muted">
                    <div class="spinner-border spinner-border-sm me-2"></div>Учитавање...
                </div>
            </template>
            <template x-if="!loading && messages.length === 0 && settingsConfigured">
                <div class="text-center p-4 text-muted">
                    <template x-if="folderWarmupActive">
                        <div>
                            <div class="spinner-border spinner-border-sm mb-2"></div>
                            <div>Учитавам поруке из овог фолдера...</div>
                        </div>
                    </template>
                    <template x-if="!folderWarmupActive">
                        <div>
                            <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                            Нема порука у овом фолдеру.
                        </div>
                    </template>
                </div>
            </template>
            <template x-for="m in messages" :key="m.uid">
                <div class="message-item" :class="{'unread': !m.is_read, 'active': activeTabUid === m.uid && !multiSelectMode, 'has-tab': m._isOpen, 'multi-selected': multiSelectMode && selectedUids.includes(m.uid)}"
                     @click="if(_longPressTriggered) { _longPressTriggered = false; return; } multiSelectMode ? toggleMultiSelect(m) : selectMessage(m)"
                     @contextmenu.prevent="openMessageContextMenu($event, m)"
                     @mousedown="startLongPress($event, m)"
                     @mouseup="cancelLongPress()"
                     @mouseleave="cancelLongPress()"
                     @touchstart.passive="startLongPress($event, m)"
                     @touchend="cancelLongPress()"
                     @touchmove="cancelLongPress()">
                    <template x-if="multiSelectMode">
                        <div class="msg-checkbox">
                            <i class="bi" :class="selectedUids.includes(m.uid) ? 'bi-check-circle-fill' : 'bi-circle'"></i>
                        </div>
                    </template>
                    <div class="msg-avatar" x-show="!multiSelectMode" :style="'background:' + m._senderColor">
                        <span x-text="m._initials"></span>
                    </div>
                    <div class="msg-content">
                        <div class="msg-sender" :style="'color:' + m._senderColor" x-text="m.from_name"></div>
                        <div class="msg-subject" x-text="m.subject || '(нема наслова)'"></div>
                    </div>
                    <div class="msg-date" x-text="m._dateLabel"></div>
                </div>
            </template>
            <!-- Pagination -->
            <div class="mail-pagination" x-show="totalPages > 1">
                <button class="btn btn-sm btn-outline-secondary" :disabled="currentPage <= 1"
                        @click="goPage(currentPage - 1)"><i class="bi bi-chevron-left"></i></button>
                <span class="small text-muted mx-2" x-text="currentPage + ' / ' + totalPages"></span>
                <button class="btn btn-sm btn-outline-secondary" :disabled="currentPage >= totalPages"
                        @click="goPage(currentPage + 1)"><i class="bi bi-chevron-right"></i></button>
            </div>

            <!-- Message right-click context menu -->
            <div class="tab-context-menu message-context-menu" x-show="messageContextMenu.visible"
                 x-transition:enter="transition ease-out duration-100"
                 x-transition:enter-start="opacity-0 scale-95"
                 x-transition:enter-end="opacity-100 scale-100"
                 x-transition:leave="transition ease-in duration-75"
                 x-transition:leave-start="opacity-100 scale-100"
                 x-transition:leave-end="opacity-0 scale-95"
                 :style="'left:' + messageContextMenu.x + 'px;top:' + messageContextMenu.y + 'px'"
                 @click.outside="messageContextMenu.visible = false">
                <div class="tab-ctx-item" @click="openMessageFromContextMenu()">
                    <i class="bi bi-envelope-open me-2"></i>Отвори
                </div>
                <div class="tab-ctx-item" @click="replyFromContextMenu()">
                    <i class="bi bi-reply me-2"></i>Одговори
                </div>
                <div class="tab-ctx-item" @click="toggleReadFromContextMenu()">
                    <i class="bi me-2" :class="messageContextMenu.message && messageContextMenu.message.is_read ? 'bi-envelope' : 'bi-envelope-open'"></i>
                    <span x-text="messageContextMenu.message && messageContextMenu.message.is_read ? 'Означи као непрочитано' : 'Означи као прочитано'"></span>
                </div>
                <div class="tab-ctx-divider"></div>
                <div class="tab-ctx-item" @click="archiveFromContextMenu()">
                    <i class="bi bi-archive me-2"></i>Архивирај
                </div>
                <div class="tab-ctx-item text-danger" @click="deleteFromContextMenu()">
                    <i class="bi bi-trash me-2"></i>Обриши
                </div>
            </div>
        </div>

        <!-- Reader pane -->
        <div class="mail-reader">
            <!-- Tab bar -->
            <div class="mail-tab-bar" x-show="openTabs.length > 0"
                 @keydown.window.ctrl.w.prevent="closeTab(activeTabUid)"
                 @keydown.window.ctrl.tab.prevent="cycleTab(1)"
                 @keydown.window.ctrl.shift.tab.prevent="cycleTab(-1)">
                <!-- Scroll left button -->
                <button class="mail-tab-scroll-btn" x-show="tabsOverflow"
                        @click="scrollTabs(-120)" title="Помери лево">
                    <i class="bi bi-chevron-left"></i>
                </button>
                <div class="mail-tab-list" x-ref="tabList"
                     @scroll="checkTabsOverflow()"
                     @wheel.prevent="$refs.tabList.scrollLeft += $event.deltaY">
                    <template x-for="(tab, tabIndex) in openTabs" :key="tab.uid">
                        <div class="mail-tab"
                             :class="{'active': activeTabUid === tab.uid, 'unread-tab': tab.wasUnread}"
                             @click="switchTab(tab.uid)"
                             @auxclick.prevent="if($event.button===1) closeTab(tab.uid)"
                             @contextmenu.prevent="openTabContextMenu($event, tab.uid)"
                             :title="tab.from_name + '\n' + (tab.subject || '(нема наслова)') + '\n' + formatDate(tab.date)"
                             draggable="true"
                             @dragstart="onTabDragStart($event, tabIndex)"
                             @dragover.prevent="onTabDragOver($event, tabIndex)"
                             @drop.prevent="onTabDrop($event, tabIndex)"
                             @dragend="tabDragIndex = -1">
                            <span class="mail-tab-indicator" :style="'background:' + avatarColor(tab.from_name)"></span>
                            <span class="mail-tab-unread-dot" x-show="tab.wasUnread"></span>
                            <span class="mail-tab-subject" x-text="tab.subject || '(нема наслова)'"></span>
                            <button class="mail-tab-close" @click.stop="closeTab(tab.uid)" title="Затвори (Ctrl+W)">
                                <i class="bi bi-x"></i>
                            </button>
                        </div>
                    </template>
                </div>
                <!-- Scroll right button -->
                <button class="mail-tab-scroll-btn" x-show="tabsOverflow"
                        @click="scrollTabs(120)" title="Помери десно">
                    <i class="bi bi-chevron-right"></i>
                </button>
                <!-- Tab count badge -->
                <span class="mail-tab-count" x-show="openTabs.length > 1"
                      x-text="openTabs.length" :title="openTabs.length + ' отворених порука'"></span>
                <button class="mail-tab-close-all" x-show="openTabs.length > 1"
                        @click="closeAllTabs()" title="Затвори све">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>

            <!-- Tab right-click context menu -->
            <div class="tab-context-menu" x-show="tabContextMenu.visible"
                 x-transition:enter="transition ease-out duration-100"
                 x-transition:enter-start="opacity-0 scale-95"
                 x-transition:enter-end="opacity-100 scale-100"
                 x-transition:leave="transition ease-in duration-75"
                 x-transition:leave-start="opacity-100 scale-100"
                 x-transition:leave-end="opacity-0 scale-95"
                 :style="'left:' + tabContextMenu.x + 'px;top:' + tabContextMenu.y + 'px'"
                 @click.outside="tabContextMenu.visible = false">
                <div class="tab-ctx-item" @click="closeTab(tabContextMenu.uid); tabContextMenu.visible = false">
                    <i class="bi bi-x me-2"></i>Затвори
                </div>
                <div class="tab-ctx-item" @click="closeOtherTabs(tabContextMenu.uid); tabContextMenu.visible = false">
                    <i class="bi bi-x-circle me-2"></i>Затвори остале
                </div>
                <div class="tab-ctx-item" @click="closeTabsToRight(tabContextMenu.uid); tabContextMenu.visible = false">
                    <i class="bi bi-arrow-right me-2"></i>Затвори десно
                </div>
                <div class="tab-ctx-divider"></div>
                <div class="tab-ctx-item" @click="closeAllTabs(); tabContextMenu.visible = false">
                    <i class="bi bi-x-lg me-2"></i>Затвори све
                </div>
            </div>

            <template x-if="openTabs.length === 0 && !loadingMessage">
                <div class="reader-empty">
                    <i class="bi bi-envelope-open fs-1 d-block mb-2"></i>
                    Изаберите поруку за читање
                </div>
            </template>
            <template x-if="loadingMessage">
                <div class="reader-empty">
                    <div class="spinner-border text-primary mb-2"></div>
                    <span class="text-muted">Учитавам поруку...</span>
                </div>
            </template>
            <template x-if="activeTabMessage && !loadingMessage">
                <div class="reader-content">
                    <div class="reader-header">
                        <div class="reader-headline">
                            <div class="reader-subject" x-text="activeTabMessage.subject || '(нема наслова)'"></div>
                            <button type="button"
                                    class="reader-toggle-btn"
                                    @click="toggleReaderSection('header')"
                                    :aria-expanded="isReaderSectionOpen('header')">
                                <span x-text="isReaderSectionOpen('header') ? 'Смањи заглавље' : 'Прошири заглавље'"></span>
                                <i class="bi" :class="isReaderSectionOpen('header') ? 'bi-chevron-up' : 'bi-chevron-down'"></i>
                            </button>
                        </div>

                        <div class="reader-sender-row reader-sender-row-compact">
                            <div class="msg-avatar-lg" :style="'background:' + avatarColor(activeTabMessage.from_name)">
                                <span x-text="initials(activeTabMessage.from_name)"></span>
                            </div>
                            <div class="reader-sender-main">
                                <div class="reader-sender-info">
                                    <div class="reader-sender-name">
                                        <strong :style="'color:' + avatarColor(activeTabMessage.from_name)" x-text="activeTabMessage.from_name"></strong>
                                        <span class="reader-sender-email" x-text="'<' + activeTabMessage.from_address + '>'"></span>
                                    </div>
                                    <div class="reader-sender-meta">
                                        <span class="reader-meta-chip">
                                            <i class="bi bi-people"></i>
                                            <span x-text="recipientCountLabel(activeTabMessage)"></span>
                                        </span>
                                        <span class="reader-meta-chip" x-show="(activeTabMessage.attachments || []).length > 0">
                                            <i class="bi bi-paperclip"></i>
                                            <span x-text="attachmentCountLabel(activeTabMessage)"></span>
                                        </span>
                                        <span class="reader-meta-chip" x-show="(activeTabMessage.links || []).length > 0">
                                            <i class="bi bi-link-45deg"></i>
                                            <span x-text="linkCountLabel(activeTabMessage.links)"></span>
                                        </span>
                                    </div>
                                </div>
                                <div class="reader-date" x-text="formatDateFull(activeTabMessage.date)"></div>
                            </div>
                        </div>

                        <div class="reader-meta-panel" x-show="isReaderSectionOpen('header')">
                            <div class="reader-panel-row">
                                <div class="reader-panel-label">Прималац</div>
                                <div class="reader-panel-value">
                                    <template x-for="t in (activeTabMessage.to || [])" :key="t.address">
                                        <span x-text="t.name || t.address" class="me-2"></span>
                                    </template>
                                    <span x-show="(activeTabMessage.to || []).length === 0" class="text-muted">Нема прималаца</span>
                                </div>
                            </div>
                            <div class="reader-panel-row" x-show="activeTabMessage.cc && activeTabMessage.cc.length">
                                <div class="reader-panel-label">CC</div>
                                <div class="reader-panel-value">
                                    <template x-for="c in (activeTabMessage.cc || [])" :key="c.address">
                                        <span x-text="c.name || c.address" class="me-2"></span>
                                    </template>
                                </div>
                            </div>

                            <div class="reader-actions">
                                <button class="btn btn-sm btn-outline-primary" @click="openReply()">
                                    <i class="bi bi-reply me-1"></i>Одговори
                                </button>
                                <button class="btn btn-sm btn-outline-primary" @click="openForward()">
                                    <i class="bi bi-forward me-1"></i>Проследи
                                </button>
                                <button class="btn btn-sm btn-outline-danger" @click="deleteSelected()">
                                    <i class="bi bi-trash me-1"></i>Обриши
                                </button>
                                <button class="btn btn-sm btn-outline-secondary" @click="archiveSelected()">
                                    <i class="bi bi-archive me-1"></i>Архивирај
                                </button>
                                <div class="dropdown d-inline-block">
                                    <button class="btn btn-sm btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown">
                                        <i class="bi bi-folder-symlink me-1"></i>Премести
                                    </button>
                                    <ul class="dropdown-menu">
                                        <template x-for="f in folders" :key="'mv-'+f.name">
                                            <li><a class="dropdown-item" href="#"
                                                   @click.prevent="moveSelected(f.name)"
                                                   x-text="folderDisplayName(f.name)"></a></li>
                                        </template>
                                    </ul>
                                </div>
                            </div>

                            <div class="reader-attachments" x-show="(activeTabMessage.attachments || []).length > 0">
                                <i class="bi bi-paperclip reader-att-icon"></i>
                                <template x-for="(att, i) in (activeTabMessage.attachments || [])" :key="i">
                                    <a :href="'/api/mail/attachment/' + activeTabMessage.uid + '/' + i + '?folder=' + encodeURIComponent(activeTabFolder)"
                                       :class="att.dangerous ? 'att-chip att-chip-danger' : 'att-chip'"
                                       @click.prevent="handleAttachmentClick($event, att)"
                                       download :title="(att.dangerous ? 'Пажња: потенцијално ризичан прилог. ' : 'Преузми ') + att.filename">
                                        <i class="bi me-1" :class="att.dangerous ? 'bi-exclamation-triangle-fill' : 'bi-download'"></i>
                                        <span x-text="att.filename"></span>
                                        <span class="att-chip-size" x-text="formatSize(att.size)"></span>
                                    </a>
                                </template>
                                <a x-show="(activeTabMessage.attachments || []).length > 1"
                                   :href="'/api/mail/attachments-all/' + activeTabMessage.uid + '?folder=' + encodeURIComponent(activeTabFolder)"
                                   class="att-chip att-chip-all" download title="Преузми све прилоге (ZIP)"
                                   @click.prevent="handleAttachmentBundleClick($event)">
                                    <i class="bi bi-file-zip me-1"></i>Преузми све
                                </a>
                            </div>
                        </div>

                        <div class="reader-security-panel reader-collapsible" x-show="activeTabMessage.security && (
                                activeTabMessage.security.external_sender ||
                                activeTabMessage.security.reply_to_mismatch ||
                                (activeTabMessage.security.suspicious_links || []).length > 0 ||
                                (activeTabMessage.security.dangerous_attachments || []).length > 0
                            )">
                            <button type="button"
                                    class="reader-collapsible-toggle"
                                    @click="toggleReaderSection('security')"
                                    :aria-expanded="isReaderSectionOpen('security')">
                                <div class="reader-collapsible-head">
                                    <div class="reader-security-title">
                                        <i class="bi bi-shield-exclamation me-1"></i>Безбедносна упозорења
                                    </div>
                                    <div class="reader-collapsible-summary">
                                        <span :class="'security-score security-score-' + (activeTabMessage.security.risk_level || 'low')"
                                              x-text="'Ризик ' + (activeTabMessage.security.score || 0) + '/10'"></span>
                                        <span class="reader-meta-chip"
                                              x-show="activeTabMessage.security && (activeTabMessage.security.suspicious_links || []).length > 0"
                                              x-text="(activeTabMessage.security.suspicious_links || []).length + ' линка'"></span>
                                        <span class="reader-meta-chip"
                                              x-show="activeTabMessage.security && (activeTabMessage.security.dangerous_attachments || []).length > 0"
                                              x-text="(activeTabMessage.security.dangerous_attachments || []).length + ' прилога'"></span>
                                    </div>
                                </div>
                                <span class="reader-collapsible-chevron">
                                    <i class="bi" :class="isReaderSectionOpen('security') ? 'bi-chevron-up' : 'bi-chevron-down'"></i>
                                </span>
                            </button>
                            <div class="reader-collapsible-body" x-show="isReaderSectionOpen('security')">
                                <div class="reader-security-badges">
                                    <span class="security-chip security-chip-warning"
                                          x-show="activeTabMessage.security && activeTabMessage.security.external_sender">
                                        <i class="bi bi-globe2"></i>Спољни пошиљалац
                                    </span>
                                    <span class="security-chip security-chip-danger"
                                          x-show="activeTabMessage.security && activeTabMessage.security.reply_to_mismatch">
                                        <i class="bi bi-arrow-left-right"></i>Reply-To се не поклапа
                                    </span>
                                    <span class="security-chip security-chip-danger"
                                          x-show="activeTabMessage.security && (activeTabMessage.security.suspicious_links || []).length > 0">
                                        <i class="bi bi-link-45deg"></i>
                                        <span x-text="(activeTabMessage.security.suspicious_links || []).length + ' сумњивих линкова'"></span>
                                    </span>
                                    <span class="security-chip security-chip-danger"
                                          x-show="activeTabMessage.security && (activeTabMessage.security.dangerous_attachments || []).length > 0">
                                        <i class="bi bi-file-earmark-break"></i>
                                        <span x-text="(activeTabMessage.security.dangerous_attachments || []).length + ' ризичних прилога'"></span>
                                    </span>
                                </div>
                                <div class="reader-security-note"
                                     x-show="activeTabMessage.security && activeTabMessage.security.reply_to_mismatch">
                                    Одговор на ову поруку би ишао на
                                    <strong x-text="activeTabMessage.security.reply_to_address"></strong>.
                                </div>
                                <div class="reader-security-note"
                                     x-show="activeTabMessage.security && (activeTabMessage.security.suspicious_links || []).length > 0">
                                    Отварајте линкове само ако домен тачно одговара ономе што очекујете.
                                </div>
                            </div>
                        </div>

                        <div class="reader-links reader-collapsible" x-show="(activeTabMessage.links || []).length > 0">
                            <button type="button"
                                    class="reader-collapsible-toggle"
                                    @click="toggleReaderSection('links')"
                                    :aria-expanded="isReaderSectionOpen('links')">
                                <div class="reader-collapsible-head">
                                    <div class="reader-links-title">
                                        <i class="bi bi-link-45deg me-1"></i>Откривени линкови
                                    </div>
                                    <div class="reader-collapsible-summary">
                                        <span class="reader-meta-chip" x-text="linkCountLabel(activeTabMessage.links)"></span>
                                        <span class="reader-meta-chip"
                                              x-show="(activeTabMessage.security?.suspicious_links || []).length > 0"
                                              x-text="(activeTabMessage.security.suspicious_links || []).length + ' сумњивих'"></span>
                                    </div>
                                </div>
                                <span class="reader-collapsible-chevron">
                                    <i class="bi" :class="isReaderSectionOpen('links') ? 'bi-chevron-up' : 'bi-chevron-down'"></i>
                                </span>
                            </button>
                            <div class="reader-collapsible-body" x-show="isReaderSectionOpen('links')">
                                <div class="reader-links-list">
                                    <template x-for="(link, idx) in (activeTabMessage.links || [])" :key="idx">
                                        <button type="button"
                                                :class="link.suspicious ? 'link-chip link-chip-danger' : 'link-chip'"
                                                :title="linkReasonText(link.reasons)"
                                                @click="confirmOpenLink(link.url)">
                                            <i class="bi" :class="link.suspicious ? 'bi-shield-exclamation' : 'bi-box-arrow-up-right'"></i>
                                            <span x-text="link.host || link.label || link.url"></span>
                                        </button>
                                    </template>
                                </div>
                                <div class="reader-links-note" x-show="activeTabMessage.html_body">
                                    Линкови у HTML прегледу су онемогућени. Отварајте их само преко ове листе.
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- Body -->
                    <div class="reader-body">
                        <template x-if="activeTabMessage.html_body">
                            <div class="mail-iframe-shell">
                                <iframe class="mail-iframe" :srcdoc="activeTabMessage.html_body"
                                        sandbox=""
                                        referrerpolicy="no-referrer"></iframe>
                            </div>
                        </template>
                        <template x-if="!activeTabMessage.html_body">
                            <div class="mail-text-body" x-html="linkifyText(activeTabMessage.text_body)"
                                 @click="handleBodyLinkClick($event)"></div>
                        </template>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- Compose Modal -->
    <div class="modal fade" :class="{'show d-block': composeOpen}" tabindex="-1"
         x-show="composeOpen" x-transition @click.self="composeOpen = false">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-pencil-square me-2"></i>
                        <span x-text="composeMode === 'reply' ? 'Одговори' : composeMode === 'forward' ? 'Проследи' : 'Нова порука'"></span>
                    </h5>
                    <button type="button" class="btn-close" @click="composeOpen = false"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-2">
                        <label class="form-label small mb-1">Прималац</label>
                        <div class="input-group input-group-sm">
                            <input type="text" class="form-control" x-model="composeTo" placeholder="email@example.com">
                            <button class="btn btn-outline-secondary" type="button"
                                    @click="openContactPicker('to')" title="Контакти музеја">
                                <i class="bi bi-person-lines-fill"></i>
                            </button>
                        </div>
                    </div>
                    <div class="mb-2">
                        <label class="form-label small mb-1">CC</label>
                        <div class="input-group input-group-sm">
                            <input type="text" class="form-control" x-model="composeCc" placeholder="(опционо)">
                            <button class="btn btn-outline-secondary" type="button"
                                    @click="openContactPicker('cc')" title="Контакти музеја">
                                <i class="bi bi-person-lines-fill"></i>
                            </button>
                        </div>
                    </div>
                    <!-- Contact Picker Dropdown -->
                    <div class="contact-picker" x-show="showContactPicker" x-transition
                         @click.outside="showContactPicker = false">
                        <div class="contact-picker-header">
                            <div class="input-group input-group-sm">
                                <span class="input-group-text"><i class="bi bi-search"></i></span>
                                <input type="text" class="form-control" x-model="contactSearch"
                                       placeholder="Претражи запослене..." x-ref="contactSearchInput"
                                       @keydown.escape="showContactPicker = false">
                            </div>
                        </div>
                        <div class="contact-picker-list">
                            <template x-for="c in filteredContacts" :key="c.email">
                                <div class="contact-picker-item" @click="pickContact(c)">
                                    <div class="contact-avatar" :style="'background:' + avatarColor(c.name)">
                                        <span x-text="initials(c.name)"></span>
                                    </div>
                                    <div class="contact-info">
                                        <div class="contact-name" :style="'color:' + avatarColor(c.name)" x-text="c.name"></div>
                                        <div class="contact-email" x-text="c.email"></div>
                                        <div class="contact-dept" x-text="c.department + (c.position ? ' — ' + c.position : '')"></div>
                                    </div>
                                </div>
                            </template>
                            <div x-show="filteredContacts.length === 0" class="text-center text-muted small p-3">
                                Нема резултата
                            </div>
                        </div>
                    </div>
                    <div class="mb-2">
                        <label class="form-label small mb-1">Наслов</label>
                        <input type="text" class="form-control form-control-sm" x-model="composeSubject">
                    </div>
                    <div class="mb-2">
                        <label class="form-label small mb-1">Порука</label>
                        <textarea class="form-control" x-model="composeBody" rows="12" style="font-family:monospace;font-size:0.9rem"></textarea>
                    </div>
                    <!-- Attachments -->
                    <div class="mb-2">
                        <label class="form-label small mb-1">Прилози</label>
                        <div class="d-flex align-items-center gap-2">
                            <button type="button" class="btn btn-outline-secondary btn-sm"
                                    @click="$refs.composeFileInput.click()">
                                <i class="bi bi-paperclip me-1"></i>Приложи фајл
                            </button>
                            <span class="small text-muted" x-show="composeFiles.length > 0"
                                  x-text="composeFiles.length + ' фајл(ова) — ' + formatSize(composeTotalSize())"></span>
                        </div>
                        <input type="file" x-ref="composeFileInput" class="d-none" multiple
                               @change="onComposeFileSelect($event)">
                        <div class="mt-2" x-show="composeFiles.length > 0">
                            <template x-for="(f, i) in composeFiles" :key="i">
                                <div class="d-inline-flex align-items-center gap-1 me-2 mb-1 badge bg-light text-dark border"
                                     style="font-size:0.8rem; padding:4px 8px;">
                                    <i class="bi bi-paperclip"></i>
                                    <span x-text="f.name"></span>
                                    <span class="text-muted" x-text="'(' + formatSize(f.size) + ')'"></span>
                                    <button type="button" class="btn-close btn-close-sm ms-1"
                                            @click="removeComposeFile(i)" style="font-size:0.6rem;"></button>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary btn-sm" @click="composeOpen = false">Откажи</button>
                    <button class="btn btn-primary btn-sm" @click="sendCompose()" :disabled="sending">
                        <span x-show="!sending"><i class="bi bi-send me-1"></i>Пошаљи</span>
                        <span x-show="sending"><span class="spinner-border spinner-border-sm me-1"></span>Шаљем...</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal-backdrop fade show" x-show="composeOpen" x-transition></div>

    <!-- Toast notification -->
    <div class="position-fixed bottom-0 end-0 p-3" style="z-index:9999">
        <div class="toast align-items-center border-0" :class="toastType === 'success' ? 'text-bg-success' : 'text-bg-danger'"
             x-ref="toast" role="alert">
            <div class="d-flex">
                <div class="toast-body" x-text="toastMsg"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>
</div>

<style>
/* Mail App Layout */
.mail-app {
    --mail-reader-shell-bg:
        radial-gradient(circle at top right, rgba(133, 84, 55, 0.1), transparent 30%),

        linear-gradient(180deg, rgba(251, 244, 232, 0.96), rgba(238, 223, 194, 0.95));
    --mail-reader-paper-bg:
        linear-gradient(90deg, rgba(107, 67, 39, 0.03), transparent 12%, transparent 88%, rgba(107, 67, 39, 0.03)),
        linear-gradient(180deg, rgba(255, 247, 228, 0.26), rgba(255, 255, 255, 0)),
        linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(248, 241, 229, 0.98));
    --mail-reader-paper-border: rgba(141, 101, 63, 0.18);
    --mail-reader-paper-shadow:
        0 18px 28px rgba(80, 54, 31, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.78);
    position: relative;
    display: flex;
    flex-direction: column;
    height: calc(100vh - 80px);
    overflow: hidden;
    border: 1px solid rgba(126, 93, 62, 0.24);
    border-radius: 26px;
    background:
        radial-gradient(circle at 18% 12%, rgba(255, 247, 231, 0.72), transparent 22%),
        linear-gradient(180deg, rgba(250, 244, 234, 0.96), rgba(234, 220, 192, 0.95));
    box-shadow:
        0 20px 38px rgba(66, 38, 20, 0.16),
        inset 0 1px 0 rgba(255, 255, 255, 0.62);
    backdrop-filter: blur(8px);
}

.mail-toolbar {
    padding: 10px 16px;
    border-bottom: 1px solid var(--bs-border-color);
    background: linear-gradient(180deg, rgba(251, 246, 238, 0.96), rgba(236, 223, 197, 0.94));
}

.mail-layout { display: grid; grid-template-columns: clamp(272px, 18vw, 320px) 360px minmax(0, 1fr); flex: 1; overflow: hidden; }

/* Folder pane */
.mail-folders { border-right: 1px solid rgba(121, 85, 53, 0.2); overflow-y: auto; display: flex; flex-direction: column;
    background:
        radial-gradient(circle at 18% 14%, rgba(255, 250, 239, 0.96), transparent 26%),
        linear-gradient(180deg, rgba(252, 248, 240, 0.98) 0%, rgba(241, 231, 209, 0.98) 100%);
    box-shadow:
        inset -1px 0 0 rgba(255, 255, 255, 0.72),
        inset 0 1px 0 rgba(255, 255, 255, 0.64); }

/* Brand header */
.folder-brand { display: flex; align-items: center; gap: 12px; padding: 16px 16px 12px;
    border-bottom: 1px solid rgba(121, 85, 53, 0.12); }
.folder-brand-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #4e79a7, #3b5f8a); color: #fff; font-size: 1.1rem;
    box-shadow: 0 3px 10px rgba(78,121,167,0.35); }
.folder-brand-text { flex: 1; }
.folder-brand-title { font-size: 1.04rem; font-weight: 800; letter-spacing: -0.25px; color: #2f1c10; }
.folder-brand-sub { font-size: 0.74rem; color: rgba(70, 45, 28, 0.94); margin-top: 1px; font-weight: 700; }

/* Section label */
.folder-section-label { padding: 10px 16px 6px; font-size: 0.74rem; font-weight: 800; text-transform: uppercase;
    letter-spacing: 1.05px; color: rgba(70, 45, 28, 0.94); opacity: 1; }

/* Folder list */
.folder-list { flex: 1; padding: 4px 10px 10px; }
.folder-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; cursor: pointer;
    font-size: 0.92rem; border-radius: 12px; margin-bottom: 6px; transition: all 0.2s ease; position: relative;
    background: rgba(255, 255, 255, 0.68); border: 1px solid rgba(128, 92, 57, 0.14);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75), 0 1px 2px rgba(89, 58, 35, 0.06); }
.folder-item:hover { background: rgba(255, 248, 236, 0.98); transform: translateX(2px); border-color: rgba(128, 92, 57, 0.22);
    box-shadow: 0 8px 18px rgba(89, 58, 35, 0.1); }
.folder-item.active { background: linear-gradient(180deg, rgba(229, 240, 235, 0.98), rgba(214, 229, 222, 0.96)); font-weight: 700;
    border-color: rgba(39, 82, 69, 0.24); box-shadow: 0 10px 18px rgba(39, 82, 69, 0.12); }
.folder-item.active::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
    width: 4px; height: 60%; border-radius: 0 4px 4px 0; background: var(--bs-primary); }

/* Folder icon circles */
.folder-icon-wrap { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center;
    justify-content: center; font-size: 0.8rem; flex-shrink: 0; transition: transform 0.2s, box-shadow 0.2s; }
.folder-item:hover .folder-icon-wrap { transform: scale(1.1); }
.folder-item.active .folder-icon-wrap { box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
.folder-icon-blue   { background: rgba(78,121,167,0.15);  color: #4e79a7; }
.folder-icon-teal   { background: rgba(118,183,178,0.15); color: #2d9e93; }
.folder-icon-amber  { background: rgba(237,201,72,0.2);   color: #b89b1e; }
.folder-icon-red    { background: rgba(225,87,89,0.12);   color: #e15759; }
.folder-icon-orange { background: rgba(242,142,43,0.15);  color: #d97a1e; }
.folder-icon-purple { background: rgba(176,122,161,0.15); color: #9b5d8b; }
.folder-icon-gray   { background: rgba(150,150,150,0.1);  color: #888; }

.folder-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #2f1c10; font-weight: 700;
    letter-spacing: 0.01em; }

/* Folder unread badge */
.folder-badge { min-width: 20px; height: 20px; display: flex; align-items: center; justify-content: center;
    font-size: 0.68rem; font-weight: 700; border-radius: 10px; padding: 0 6px;
    background: var(--bs-primary); color: #fff; flex-shrink: 0; animation: pulsate 1.5s ease-in-out infinite; }

/* Bottom settings link */
.folder-bottom { padding: 12px 16px; border-top: 1px solid rgba(121, 85, 53, 0.12); margin-top: auto; }
.folder-settings-link { display: flex; align-items: center; font-size: 0.84rem; color: rgba(70, 45, 28, 0.94);
    text-decoration: none; padding: 8px 10px; border-radius: 10px; transition: all 0.2s; font-weight: 700;
    background: rgba(255, 255, 255, 0.34); border: 1px solid rgba(128, 92, 57, 0.12); }
.folder-settings-link:hover { background: rgba(255, 251, 244, 0.9); color: var(--bs-body-color); border-color: rgba(128, 92, 57, 0.2); }

/* Sort bar */
.mail-sort-bar { display: flex; gap: 2px; padding: 6px 8px; border-bottom: 1px solid var(--bs-border-color);
    background: linear-gradient(180deg, rgba(251, 246, 238, 0.94), rgba(238, 226, 203, 0.92)); flex-shrink: 0; }
.mail-sort-btn { display: inline-flex; align-items: center; gap: 3px; padding: 3px 10px; border: none;
    background: none; font-size: 0.72rem; font-weight: 600; color: var(--bs-secondary-color);
    border-radius: 6px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
.mail-sort-btn:hover { background: var(--bs-tertiary-bg); color: var(--bs-body-color); }
.mail-sort-btn.active { background: var(--bs-primary-bg-subtle); color: var(--bs-primary); }
.mail-sort-btn i { font-size: 0.7rem; }

/* Message list pane */
.mail-list { border-right: 1px solid var(--bs-border-color); overflow-y: auto; display: flex; flex-direction: column;
    background: linear-gradient(180deg, rgba(255, 252, 247, 0.94), rgba(241, 231, 211, 0.94)); }
.message-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--bs-border-color-translucent); cursor: pointer; transition: background 0.15s;
    background: rgba(255, 252, 248, 0.3); }
.message-item:hover { background: rgba(208, 181, 128, 0.22); }
.message-item.active { background: rgba(55, 93, 80, 0.16); border-left: 3px solid var(--bs-primary); }
.message-item.has-tab:not(.active) { border-left: 3px solid var(--bs-secondary-bg); }
.message-item.unread .msg-sender, .message-item.unread .msg-subject { font-weight: 700; }
.message-item.unread .msg-avatar { animation: pulsate 2s ease-in-out infinite; }
.message-item.multi-selected { background: rgba(55, 93, 80, 0.18); border-left: 3px solid var(--bs-primary); }
.msg-checkbox { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    font-size: 1.3rem; color: var(--bs-primary); transition: transform 0.15s; }
.message-item.multi-selected .msg-checkbox { transform: scale(1.15); }

/* Multi-select bar */
.multi-select-bar { display: flex; align-items: center; padding: 5px 6px; flex-shrink: 0; gap: 4px;
    background: linear-gradient(135deg, rgba(22, 50, 41, 0.92), rgba(55, 93, 80, 0.88));
    border-bottom: 2px solid rgba(208, 181, 128, 0.4); overflow: hidden; box-sizing: border-box; width: 100%; }
.msel-count { font-size: 0.7rem; font-weight: 700; color: rgba(255,255,255,0.92); letter-spacing: 0.02em;
    white-space: nowrap; flex-shrink: 0; }
.msel-actions { display: flex; gap: 2px; flex: 1; justify-content: flex-end; min-width: 0; flex-wrap: wrap; }
.msel-btn { display: inline-flex; align-items: center; gap: 3px; padding: 3px 7px; border: 1px solid rgba(255,255,255,0.2);
    border-radius: 6px; font-size: 0.68rem; font-weight: 600; cursor: pointer; transition: all 0.15s;
    background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.88); white-space: nowrap; }
.msel-btn:hover { background: rgba(255,255,255,0.18); color: #fff; transform: translateY(-1px); }
.msel-btn:disabled { opacity: 0.35; pointer-events: none; }
.msel-btn i { font-size: 0.74rem; }
.msel-btn-delete { border-color: rgba(220, 53, 69, 0.4); }
.msel-btn-delete:hover { background: rgba(220, 53, 69, 0.5); border-color: rgba(220, 53, 69, 0.6); }

.msg-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 0.8rem; font-weight: 600; flex-shrink: 0; animation: pulsate-glow 3s ease-in-out infinite; }
.msg-avatar-lg { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 0.9rem; font-weight: 600; flex-shrink: 0; animation: pulsate-glow 3s ease-in-out infinite; }
.msg-content { flex: 1; min-width: 0; }
.msg-sender { font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.msg-subject { font-size: 0.8rem; color: rgba(84, 61, 44, 0.86); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.mail-pagination { padding: 8px; text-align: center; border-top: 1px solid var(--bs-border-color); margin-top: auto;

.reader-header { padding: 16px 20px; border-bottom: 1px solid var(--bs-border-color);

.reader-headline { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.reader-toggle-btn { display: inline-flex; align-items: center; gap: 8px; padding: 6px 11px; border-radius: 999px;

.reader-toggle-btn:hover { background: rgba(255, 252, 246, 0.96); border-color: rgba(136, 98, 61, 0.28); }

/* Sender row */
.reader-sender-row { display: flex; align-items: flex-start; gap: 12px; }
.reader-sender-main { flex: 1; min-width: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }

.reader-sender-name { font-size: 0.88rem; line-height: 1.4; }
.reader-sender-email { color: rgba(98, 74, 56, 0.84); font-size: 0.82rem; margin-left: 4px; }
.reader-date { font-size: 0.78rem; color: rgba(98, 74, 56, 0.84); white-space: nowrap;

.reader-sender-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.reader-meta-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
    border: 1px solid rgba(136, 98, 61, 0.16); background: rgba(255, 252, 246, 0.9); color: rgba(91, 58, 36, 0.94);
    font-size: 0.74rem; font-weight: 700; }
.reader-meta-panel { display: flex; flex-direction: column; gap: 10px; padding: 12px 14px;
    background: rgba(255, 248, 235, 0.78); border: 1px solid rgba(136, 98, 61, 0.14); border-radius: 14px; }
.reader-panel-row { display: flex; align-items: flex-start; gap: 12px; }
.reader-panel-label { min-width: 72px; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.05em;
    text-transform: uppercase; color: rgba(98, 74, 56, 0.76); padding-top: 2px; }
.reader-panel-value { flex: 1; min-width: 0; font-size: 0.82rem; line-height: 1.55; color: rgba(73, 49, 31, 0.94); }

.reader-collapsible { display: flex; flex-direction: column; gap: 10px; }
.reader-collapsible-toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 0; border: 0; background: transparent; color: inherit; text-align: left; width: 100%; cursor: pointer; }
.reader-collapsible-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.reader-collapsible-summary { display: flex; flex-wrap: wrap; gap: 6px; }
.reader-collapsible-chevron { display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; border-radius: 999px; background: rgba(255, 255, 255, 0.42); color: rgba(98, 74, 56, 0.92);
    border: 1px solid rgba(136, 98, 61, 0.12); flex-shrink: 0; }
.reader-collapsible-toggle:hover .reader-collapsible-chevron {
    background: rgba(255, 255, 255, 0.62);
    border-color: rgba(136, 98, 61, 0.22);
}
.reader-collapsible-body { display: flex; flex-direction: column; gap: 8px; }

.reader-security-panel { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px;
    border-radius: 12px; background: linear-gradient(180deg, rgba(255, 243, 214, 0.92), rgba(255, 236, 201, 0.92));
    border: 1px solid rgba(178, 121, 36, 0.22); }
.reader-security-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.reader-security-title { font-size: 0.82rem; font-weight: 700; color: #7a4a1e; }
.reader-security-badges { display: flex; flex-wrap: wrap; gap: 6px; }
.security-chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px;
    font-size: 0.76rem; font-weight: 700; border: 1px solid transparent; }
.security-score { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 999px;
    font-size: 0.74rem; font-weight: 800; white-space: nowrap; border: 1px solid transparent; }
.security-score-low { background: rgba(25, 135, 84, 0.12); color: #1f6b49; border-color: rgba(25, 135, 84, 0.18); }
.security-score-medium { background: rgba(255, 193, 7, 0.16); color: #865900; border-color: rgba(196, 137, 0, 0.26); }
.security-score-high { background: rgba(220, 53, 69, 0.14); color: #8a2132; border-color: rgba(176, 41, 57, 0.24); }
.security-chip-warning { background: rgba(255, 193, 7, 0.14); color: #8a5b00; border-color: rgba(196, 137, 0, 0.26); }
.security-chip-danger { background: rgba(220, 53, 69, 0.12); color: #8a2132; border-color: rgba(176, 41, 57, 0.22); }
.reader-security-note { font-size: 0.78rem; color: rgba(102, 64, 35, 0.88); }

/* Actions toolbar */
.reader-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.reader-actions .btn { font-size: 0.82rem; padding: 4px 10px; }

/* Attachments row */
.reader-attachments { display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 8px 12px; background: rgba(255, 248, 235, 0.82); border-radius: 10px;
    border: 1px solid rgba(136, 98, 61, 0.16); }
.reader-att-icon { font-size: 0.9rem; color: rgba(98, 74, 56, 0.84); flex-shrink: 0; }
.att-chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px;
    font-size: 0.8rem; text-decoration: none; border-radius: 6px;
    background: rgba(255, 251, 244, 0.88); border: 1px solid var(--bs-border-color);
    color: var(--bs-body-color); cursor: pointer; transition: all 0.15s; }
.att-chip:hover { background: var(--bs-primary-bg-subtle); border-color: var(--bs-primary);
    color: var(--bs-body-color); }
.att-chip-size { color: var(--bs-secondary-color); font-size: 0.72rem; margin-left: 2px; }
.att-chip-danger { background: rgba(255, 232, 233, 0.96); border-color: rgba(176, 41, 57, 0.26); color: #8a2132; }
.att-chip-danger:hover { background: rgba(255, 223, 226, 0.98); border-color: rgba(176, 41, 57, 0.34); color: #8a2132; }
.att-chip-all { background: var(--bs-primary); border-color: var(--bs-primary);
    color: #fff; font-weight: 600; }
.att-chip-all:hover { background: var(--bs-primary); opacity: 0.85; color: #fff; }

.reader-links { display: flex; flex-direction: column; gap: 8px; padding: 8px 12px;
    background: rgba(255, 248, 235, 0.72); border-radius: 10px; border: 1px solid rgba(136, 98, 61, 0.14); }
.reader-links-title { font-size: 0.82rem; font-weight: 700; color: rgba(98, 74, 56, 0.9); }
.reader-links-list { display: flex; flex-wrap: wrap; gap: 6px; }
.link-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px;
    border: 1px solid rgba(136, 98, 61, 0.16); background: rgba(255, 255, 255, 0.92); color: #5b3a24;
    font-size: 0.78rem; font-weight: 600; cursor: pointer; transition: all 0.15s; }
.link-chip:hover { transform: translateY(-1px); background: rgba(255, 252, 246, 0.98); border-color: rgba(136, 98, 61, 0.24); }
.link-chip-danger { background: rgba(255, 232, 233, 0.96); border-color: rgba(176, 41, 57, 0.26); color: #8a2132; }
.link-chip-danger:hover { background: rgba(255, 223, 226, 0.98); border-color: rgba(176, 41, 57, 0.34); }
.reader-links-note { font-size: 0.76rem; color: rgba(98, 74, 56, 0.82); }

/* Tab bar */
.mail-tab-bar { display: flex; align-items: stretch; border-bottom: 1px solid var(--bs-border-color);
    background: linear-gradient(180deg, rgba(236, 223, 197, 0.92), rgba(226, 209, 180, 0.96)); flex-shrink: 0; overflow: hidden; min-height: 40px; }
.mail-tab-list { display: flex; flex: 1; overflow-x: auto; overflow-y: hidden;
    scrollbar-width: thin; padding: 4px 2px 0; gap: 2px; align-items: flex-end; }
.mail-tab-list::-webkit-scrollbar { height: 3px; }
.mail-tab-list::-webkit-scrollbar-thumb { background: var(--bs-secondary-bg); border-radius: 3px; }
.mail-tab { display: flex; align-items: center; gap: 8px; padding: 8px 12px 8px 0;
    min-width: 120px; max-width: 240px; font-size: 0.84rem;
    border: 1px solid transparent; border-bottom: none;
    border-radius: 8px 8px 0 0; transition: all 0.15s; flex-shrink: 0; position: relative;
    background: transparent; }
.mail-tab:hover { background: rgba(255, 250, 244, 0.92); border-color: var(--bs-border-color-translucent); }
.mail-tab.active { background: linear-gradient(180deg, rgba(255, 251, 244, 0.98), rgba(245, 236, 220, 0.98)); border-color: var(--bs-border-color);
    box-shadow: 0 -1px 4px rgba(0,0,0,0.05); z-index: 1; }
.mail-tab.active::after { content: ''; position: absolute; bottom: -1px; left: 0; right: 0;
    height: 2px; background: rgba(248, 239, 224, 0.98); }
.mail-tab-indicator { width: 4px; height: 20px; flex-shrink: 0; border-radius: 2px;
    margin-left: 2px; }
.mail-tab-subject { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-weight: 500; line-height: 1.3; }
.mail-tab-close { display: flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; border: none; background: none; border-radius: 5px;
    font-size: 0.8rem; color: var(--bs-secondary-color); opacity: 0.5;
    cursor: pointer; flex-shrink: 0; padding: 0; transition: all 0.15s; }
.mail-tab:hover .mail-tab-close,
.mail-tab.active .mail-tab-close { opacity: 1; }
.mail-tab-close:hover { background: var(--bs-danger-bg-subtle); color: var(--bs-danger); opacity: 1; }
.mail-tab-close-all { display: flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border: none; background: none; border-radius: 6px;
    font-size: 0.72rem; color: var(--bs-secondary-color); cursor: pointer;
    flex-shrink: 0; margin: auto 6px; transition: all 0.15s; }
.mail-tab-close-all:hover { background: var(--bs-danger-bg-subtle); color: var(--bs-danger); }

/* Tab scroll buttons */
.mail-tab-scroll-btn { display: flex; align-items: center; justify-content: center;
    width: 26px; border: none; background: none; border-radius: 0;
    font-size: 0.78rem; color: var(--bs-secondary-color); cursor: pointer;
    flex-shrink: 0; padding: 0; transition: all 0.15s; }
.mail-tab-scroll-btn:hover { background: var(--bs-tertiary-bg); color: var(--bs-body-color); }

/* Tab count badge */
.mail-tab-count { display: flex; align-items: center; justify-content: center;
    min-width: 22px; height: 20px; font-size: 0.68rem; font-weight: 700;
    border-radius: 10px; padding: 0 6px; background: var(--bs-secondary-bg);
    color: var(--bs-secondary-color); flex-shrink: 0; margin: auto 2px; }

/* Tab unread dot */
.mail-tab-unread-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--bs-primary);
    flex-shrink: 0; animation: pulsate 2s ease-in-out infinite; }

/* Tab drag state */
.mail-tab.drag-over-left { border-left: 2px solid var(--bs-primary) !important; }
.mail-tab.drag-over-right { border-right: 2px solid var(--bs-primary) !important; }
.mail-tab[draggable="true"] { cursor: grab; }
.mail-tab[draggable="true"]:active { cursor: grabbing; opacity: 0.7; }

/* Unread tab subtle indicator */
.mail-tab.unread-tab .mail-tab-subject { font-weight: 700; }

/* Tab context menu */
.tab-context-menu { position: fixed; z-index: 10000; background: linear-gradient(180deg, rgba(255, 251, 244, 0.98), rgba(238, 223, 193, 0.96)); border: 1px solid var(--bs-border-color);
    border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); padding: 4px 0; min-width: 180px; }
.message-context-menu { min-width: 220px; }
.tab-ctx-item { display: flex; align-items: center; padding: 7px 14px; font-size: 0.82rem; cursor: pointer;
    transition: background 0.12s; color: var(--bs-body-color); }
.tab-ctx-item:hover { background: var(--bs-primary-bg-subtle); }
.tab-ctx-item i { font-size: 0.78rem; color: var(--bs-secondary-color); width: 16px; text-align: center; }
.tab-ctx-item.text-danger i { color: inherit; }
.tab-ctx-divider { height: 1px; background: var(--bs-border-color); margin: 4px 8px; }

.reader-body { position: relative; flex: 1; padding: 18px; overflow: auto; background: var(--mail-reader-shell-bg); }
.reader-body::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(90deg, rgba(107, 67, 39, 0.04), transparent 10%, transparent 90%, rgba(107, 67, 39, 0.04)),
        linear-gradient(180deg, rgba(255, 246, 225, 0.16), transparent 18%);
    pointer-events: none;
}
.mail-iframe-shell,
.mail-text-body {
    position: relative;
    z-index: 1;
    min-height: 100%;
    border: 1px solid var(--mail-reader-paper-border);
    border-radius: 20px;
    background: var(--mail-reader-paper-bg);
    box-shadow: var(--mail-reader-paper-shadow);
}
.mail-iframe-shell {
    display: flex;
    padding: 14px;
    overflow: hidden;
}
.mail-iframe { width: 100%; min-height: 100%; flex: 1; border: none; border-radius: 15px; background: rgba(255, 255, 255, 0.98);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.85); }
.mail-text-body { padding: 26px 28px; margin: 0; white-space: pre-wrap; word-wrap: break-word; font-family: inherit; font-size: 0.95rem;
    line-height: 1.7; color: #4a311f; }

/* Contact Picker */
.contact-picker { background: linear-gradient(180deg, rgba(255, 251, 244, 0.98), rgba(238, 223, 193, 0.96)); border: 1px solid var(--bs-border-color); border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); margin-bottom: 8px; overflow: hidden; }
.contact-picker-header { padding: 8px; border-bottom: 1px solid var(--bs-border-color); }
.contact-picker-list { max-height: 250px; overflow-y: auto; }
.contact-picker-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; cursor: pointer; transition: background 0.15s; border-bottom: 1px solid var(--bs-border-color-translucent); }
.contact-picker-item:hover { background: var(--bs-primary-bg-subtle); }
.contact-picker-item:last-child { border-bottom: none; }
.contact-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 0.7rem; font-weight: 600; flex-shrink: 0; animation: pulsate-glow 3s ease-in-out infinite; }
.contact-info { flex: 1; min-width: 0; }
.contact-name { font-size: 0.85rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.contact-email { font-size: 0.75rem; color: rgba(98, 74, 56, 0.84); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.contact-dept { font-size: 0.68rem; color: rgba(98, 74, 56, 0.78); opacity: 0.9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Pulsate animation */
@keyframes pulsate {
    0%   { transform: scale(1);   opacity: 1; }
    50%  { transform: scale(1.15); opacity: 0.7; }
    100% { transform: scale(1);   opacity: 1; }
}
@keyframes pulsate-glow {
    0%   { box-shadow: 0 0 0 0 currentColor; }
    50%  { box-shadow: 0 0 6px 2px currentColor; }
    100% { box-shadow: 0 0 0 0 currentColor; }
}

/* Spin animation */
@keyframes spin { to { transform: rotate(360deg); } }
.spin { animation: spin 1s linear infinite; }

/* Responsive: collapse to single pane on small screens */
@media (max-width: 991px) {
    .mail-layout { grid-template-columns: 1fr; }
    .mail-folders { display: none; }
    .mail-list { max-height: 40vh; }
}
@media (max-width: 767px) {
    .mail-layout { grid-template-columns: 1fr; }
    .mail-folders { display: none; }
    .reader-actions { font-size: 0.75rem; }
    .reader-headline,
    .reader-sender-main,
    .reader-panel-row { flex-direction: column; }
    .reader-toggle-btn,
    .reader-date { align-self: flex-start; }
    .reader-body { padding: 12px; }
    .mail-iframe-shell { padding: 10px; }
    .mail-text-body { padding: 20px 18px; }
}
@media (min-width: 992px) {
    .mail-folders { min-width: 240px; }
}

@keyframes pulsate-glow-dark {
