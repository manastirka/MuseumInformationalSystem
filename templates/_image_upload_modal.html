<!-- Image Upload Modal - Reusable component for all database pages -->
<div class="modal fade" id="imageUploadModal" tabindex="-1" aria-labelledby="imageUploadModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="imageUploadModalLabel">
                    <i class="bi bi-images me-2"></i>
                    <span id="imageModalTitle">Слике</span>
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <!-- Existing Images Gallery -->
                <div id="imageGallery" class="mb-4">
                    <h6 class="mb-3"><i class="bi bi-collection me-2"></i>Постојеће слике</h6>
                    <div id="imageGalleryGrid" class="row g-3">
                        <!-- Images loaded via AJAX -->
                    </div>
                    <div id="imageGalleryEmpty" class="text-center py-4 text-muted" style="display:none;">
                        <i class="bi bi-image" style="font-size: 3rem; opacity: 0.3;"></i>
                        <p class="mt-2 mb-0">Нема отпремљених слика</p>
                    </div>
                    <div id="imageGalleryLoading" class="text-center py-4">
                        <div class="spinner-border spinner-border-sm text-primary" role="status">
                            <span class="visually-hidden">Учитавање...</span>
                        </div>
                        <span class="ms-2 text-muted">Учитавање слика...</span>
                    </div>
                </div>

                <hr>

                <!-- Upload Zone -->
                <h6 class="mb-3"><i class="bi bi-cloud-arrow-up me-2"></i>Отпреми нову слику</h6>
                <div id="imageDropZone" class="border border-2 border-dashed rounded p-4 text-center"
                     style="cursor: pointer; transition: all 0.2s; border-color: #dee2e6 !important;">
                    <i class="bi bi-cloud-arrow-up" style="font-size: 2.5rem; color: #6c757d;"></i>
                    <p class="mb-1 mt-2">Превуците слику овде или кликните за одабир</p>
                    <small class="text-muted">Подржани формати: JPG, PNG, GIF, WebP (макс. 10MB)</small>
                    <input type="file" id="imageFileInput" accept="image/*" style="display: none;">
                </div>

                <!-- Upload Progress -->
                <div id="imageUploadProgress" class="mt-3" style="display: none;">
                    <div class="d-flex align-items-center">
                        <div class="flex-grow-1 me-3">
                            <div class="progress" style="height: 8px;">
                                <div id="imageProgressBar" class="progress-bar progress-bar-striped progress-bar-animated" style="width: 0%"></div>
                            </div>
                        </div>
                        <small id="imageProgressText" class="text-muted">0%</small>
                    </div>
                </div>

                <!-- Upload Status -->
                <div id="imageUploadStatus" class="mt-3" style="display: none;"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    <i class="bi bi-x-circle me-1"></i>Затвори
                </button>
            </div>
        </div>
    </div>
</div>

<style>
#imageDropZone.drag-over {
    border-color: var(--bs-primary) !important;
    background-color: rgba(13, 110, 253, 0.05);
}

.img-upload-thumb {
    position: relative;
    overflow: hidden;
    border-radius: 0.5rem;
}

.img-upload-thumb img {
    width: 100%;
    height: 140px;
    object-fit: cover;
    border-radius: 0.5rem;
    transition: opacity 0.2s;
}

.img-upload-thumb:hover img {
    opacity: 0.7;
}

.img-upload-thumb .delete-overlay {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(220, 53, 69, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.2s;
    border-radius: 0.5rem;
    cursor: pointer;
}

.img-upload-thumb:hover .delete-overlay {
    opacity: 1;
}

.img-upload-thumb .delete-overlay i {
    color: white;
    font-size: 1.5rem;
}
</style>

<script>
(function() {
    // State for the current modal context
    let _imgModal = {
        database: null,
        entityType: null,
        entityId: null,
        entityLabel: null
    };

    // Open image modal for a specific entity
    window.openImageModal = function(database, entityType, entityId, entityLabel) {
        _imgModal.database = database;
        _imgModal.entityType = entityType;
        _imgModal.entityId = entityId;
        _imgModal.entityLabel = entityLabel;

        // Update title
        document.getElementById('imageModalTitle').textContent = entityLabel || 'Слике';

        // Reset upload state
        document.getElementById('imageUploadProgress').style.display = 'none';
        document.getElementById('imageUploadStatus').style.display = 'none';

        // Load existing images
        loadEntityImages();

        // Show modal
        const modal = new bootstrap.Modal(document.getElementById('imageUploadModal'));
        modal.show();
    };

    // Load images for the current entity
    function loadEntityImages() {
        const grid = document.getElementById('imageGalleryGrid');
        const empty = document.getElementById('imageGalleryEmpty');
        const loading = document.getElementById('imageGalleryLoading');

        grid.innerHTML = '';
        empty.style.display = 'none';
        loading.style.display = 'block';

        fetch(`/api/images/entity/${_imgModal.database}/${_imgModal.entityType}/${_imgModal.entityId}`)
            .then(r => r.json())
            .then(data => {
                loading.style.display = 'none';

                if (!data.images || data.images.length === 0) {
                    empty.style.display = 'block';
                    return;
                }

                data.images.forEach(img => {
                    const col = document.createElement('div');
                    col.className = 'col-md-4 col-sm-6';
                    col.innerHTML = `
                        <div class="img-upload-thumb shadow-sm">
                            <img src="/api/images/${img.image_id}?size=medium" alt="Слика" loading="lazy">
                            <div class="delete-overlay" onclick="deleteEntityImage('${img.image_id}')" title="Обриши слику">
                                <i class="bi bi-trash3"></i>
                            </div>
                        </div>
                    `;
                    grid.appendChild(col);
                });
            })
            .catch(err => {
                loading.style.display = 'none';
                empty.style.display = 'block';
                console.error('Error loading images:', err);
            });
    }

    // Delete an image
    window.deleteEntityImage = function(imageId) {
        if (!confirm('Да ли сте сигурни да желите да обришете ову слику?')) return;

        fetch(`/api/images/${imageId}`, { method: 'DELETE' })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    loadEntityImages();
                } else {
                    alert('Грешка при брисању слике.');
                }
            })
            .catch(err => {
                console.error('Error deleting image:', err);
                alert('Грешка при брисању слике.');
            });
    };

    // Upload an image file
    function uploadImage(file) {
        if (!file || !file.type.startsWith('image/')) {
            showUploadStatus('Молимо одаберите слику.', 'warning');
            return;
        }

        if (file.size > 10 * 1024 * 1024) {
            showUploadStatus('Слика је превелика (макс. 10MB).', 'warning');
            return;
        }

        const formData = new FormData();
        formData.append('file', file);
        formData.append('database', _imgModal.database);
        formData.append('entity_type', _imgModal.entityType);
        formData.append('entity_id', _imgModal.entityId);

        const progressDiv = document.getElementById('imageUploadProgress');
        const progressBar = document.getElementById('imageProgressBar');
        const progressText = document.getElementById('imageProgressText');

        progressDiv.style.display = 'block';
        progressBar.style.width = '0%';
        progressText.textContent = '0%';

        const xhr = new XMLHttpRequest();
        xhr.open('POST', '/api/images/upload', true);

        xhr.upload.onprogress = function(e) {
            if (e.lengthComputable) {
                const pct = Math.round((e.loaded / e.total) * 100);
                progressBar.style.width = pct + '%';
                progressText.textContent = pct + '%';
            }
        };

        xhr.onload = function() {
            progressDiv.style.display = 'none';

            if (xhr.status === 201) {
                showUploadStatus('Слика је успешно отпремљена!', 'success');
                loadEntityImages();
            } else {
                let msg = 'Грешка при отпремању.';
                try {
                    const resp = JSON.parse(xhr.responseText);
                    if (resp.error) msg = resp.error;
                } catch(e) {}
                showUploadStatus(msg, 'danger');
            }
        };

        xhr.onerror = function() {
            progressDiv.style.display = 'none';
            showUploadStatus('Грешка мреже при отпремању.', 'danger');
        };

        xhr.send(formData);
    }

    function showUploadStatus(message, type) {
        const statusDiv = document.getElementById('imageUploadStatus');
        statusDiv.style.display = 'block';
        statusDiv.innerHTML = `<div class="alert alert-${type} alert-dismissible fade show py-2 mb-0" role="alert">
            ${message}
            <button type="button" class="btn-close btn-close-sm" data-bs-dismiss="alert"></button>
        </div>`;

        if (type === 'success') {
            setTimeout(() => { statusDiv.style.display = 'none'; }, 3000);
        }
    }

    // Drag-and-drop and click handlers
    document.addEventListener('DOMContentLoaded', function() {
        const dropZone = document.getElementById('imageDropZone');
        const fileInput = document.getElementById('imageFileInput');

        if (!dropZone || !fileInput) return;

        dropZone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', function() {
            if (this.files.length > 0) {
                uploadImage(this.files[0]);
                this.value = '';
            }
        });

        dropZone.addEventListener('dragover', function(e) {
            e.preventDefault();
            this.classList.add('drag-over');
        });

        dropZone.addEventListener('dragleave', function(e) {
            e.preventDefault();
            this.classList.remove('drag-over');
        });

        dropZone.addEventListener('drop', function(e) {
            e.preventDefault();
            this.classList.remove('drag-over');
            if (e.dataTransfer.files.length > 0) {
                uploadImage(e.dataTransfer.files[0]);
            }
        });
    });
})();
</script>
