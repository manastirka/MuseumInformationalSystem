{#- Deljeni stilovi Centra za odobravanje i Arhive. Uključuje se u head_extra
    blok; u templates/ je (a ne static/css/) jer static/ nije praćen u git-u
    pa ne bi stigao na produkciju kroz deploy. -#}
<style>
/* ==========================================================================
   Центар за одобравање + Архива — formalni institucionalni stil
   Jedinstven sistem statusnih oznaka za dokumenta i operativne zahteve.
   ========================================================================== */

:root {
    --oc-green-900: #12312a;
    --oc-green-800: #1b4332;
    --oc-green-700: #2d6a4f;
    --oc-green-050: #eef4f1;
    --oc-gold: #c9a15f;
    --oc-ink-soft: #4b5563;
    --oc-ink-muted: #6b7280;
    --oc-line: #d9d4c8;
    --oc-line-soft: #e7e3d8;

    /* JEDAN sistem statusnih boja — нацрт / на одобрењу / одобрено /
       одбијено / архивирано */
    --st-nacrt-fg: #4b5563;      --st-nacrt-bg: #f3f4f6;    --st-nacrt-bd: #d1d5db;
    --st-cekanje-fg: #92600a;    --st-cekanje-bg: #fdf6e7;  --st-cekanje-bd: #e4c477;
    --st-odobreno-fg: #1b5e3b;   --st-odobreno-bg: #eaf4ee; --st-odobreno-bd: #9dc4ab;
    --st-odbijeno-fg: #9b1c1c;   --st-odbijeno-bg: #fbeeee; --st-odbijeno-bd: #dfa1a1;
    --st-arhiva-fg: #374151;     --st-arhiva-bg: #eceef1;   --st-arhiva-bd: #b8bfc9;
}

/* --- zaglavlje stranice ---------------------------------------------------- */
.oc-header {
    background: #fff;
    border: 1px solid var(--oc-line-soft);
    border-left: 4px solid var(--oc-green-700);
    border-radius: 10px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 1.25rem;
}
.oc-header h2 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 700;
    color: var(--oc-green-900);
    margin-bottom: 0.15rem;
}
.oc-header p { color: var(--oc-ink-soft); margin-bottom: 0; font-size: 0.92rem; }

/* --- kartica ---------------------------------------------------------------- */
.oc-card {
    background: #fff;
    border: 1px solid var(--oc-line-soft);
    border-radius: 10px;
    box-shadow: 0 1px 2px rgba(20, 30, 25, 0.05);
    margin-bottom: 1.25rem;
    overflow: hidden;
}

/* --- tabovi (Захтеви / Документа) ------------------------------------------ */
.oc-tabs {
    display: flex;
    gap: 0.25rem;
    border-bottom: 2px solid var(--oc-line);
    margin-bottom: 1.1rem;
}
.oc-tab {
    border: none;
    background: none;
    padding: 0.6rem 1.1rem;
    font-size: 0.98rem;
    font-weight: 500;
    color: var(--oc-ink-muted);
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    cursor: pointer;
}
.oc-tab:hover { color: var(--oc-green-800); }
.oc-tab.active {
    color: var(--oc-green-900);
    font-weight: 600;
    border-bottom-color: var(--oc-green-700);
}
.oc-tab .count {
    display: inline-block;
    min-width: 1.5em;
    padding: 0.05em 0.45em;
    margin-left: 0.35em;
    border-radius: 999px;
    background: var(--oc-green-050);
    color: var(--oc-green-800);
    font-size: 0.76rem;
    font-weight: 600;
}
.oc-tab.active .count { background: var(--oc-green-700); color: #fff; }

/* --- jedinstvene statusne oznake -------------------------------------------- */
.status {
    display: inline-flex;
    align-items: center;
    gap: 0.4em;
    padding: 0.18em 0.65em;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    border: 1px solid;
    white-space: nowrap;
}
.status::before {
    content: "";
    width: 0.5em;
    height: 0.5em;
    border-radius: 50%;
    background: currentColor;
}
.status--nacrt        { color: var(--st-nacrt-fg);    background: var(--st-nacrt-bg);    border-color: var(--st-nacrt-bd); }
.status--na-odobrenju { color: var(--st-cekanje-fg);  background: var(--st-cekanje-bg);  border-color: var(--st-cekanje-bd); }
.status--odobreno     { color: var(--st-odobreno-fg); background: var(--st-odobreno-bg); border-color: var(--st-odobreno-bd); }
.status--odbijeno     { color: var(--st-odbijeno-fg); background: var(--st-odbijeno-bg); border-color: var(--st-odbijeno-bd); }
.status--arhivirano   { color: var(--st-arhiva-fg);   background: var(--st-arhiva-bg);   border-color: var(--st-arhiva-bd); }

/* --- tabela ---------------------------------------------------------------- */
.oc-table { width: 100%; border-collapse: collapse; margin-bottom: 0; }
.oc-table thead th {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--oc-ink-muted);
    font-weight: 600;
    border-bottom: 2px solid var(--oc-line);
    padding: 0.55rem 0.7rem;
    text-align: left;
    white-space: nowrap;
    background: #fff;
}
.oc-table thead th.sortable { cursor: pointer; user-select: none; }
.oc-table thead th.sortable:hover { color: var(--oc-green-800); }
.oc-table thead th.sortable::after { content: "↕"; opacity: 0.4; margin-left: 0.3em; }
.oc-table thead th.sorted-asc::after { content: "↑"; opacity: 1; color: var(--oc-green-700); }
.oc-table thead th.sorted-desc::after { content: "↓"; opacity: 1; color: var(--oc-green-700); }
.oc-table tbody td {
    padding: 0.62rem 0.7rem;
    border-bottom: 1px solid var(--oc-line-soft);
    vertical-align: middle;
    font-size: 0.9rem;
}
.oc-table tbody tr:last-child td { border-bottom: none; }
.oc-table tbody tr:hover { background: #f6f8f6; }
.oc-table .ref {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    color: var(--oc-green-900);
    white-space: nowrap;
}
.oc-table .muted { color: var(--oc-ink-muted); font-size: 0.82rem; }

/* --- tok odobravanja (Корак X од Y) ------------------------------------------ */
.oc-chain {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.3em;
    font-size: 0.8rem;
    margin-bottom: 0.15rem;
}
.oc-chain-step { color: var(--oc-ink-muted); white-space: nowrap; }
.oc-chain-step.done { color: var(--st-odobreno-fg); }
.oc-chain-step.current { color: var(--st-cekanje-fg); font-weight: 600; }
.oc-chain-arrow { color: var(--oc-line); }

/* --- filteri ---------------------------------------------------------------- */
.oc-filters {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    align-items: flex-end;
    padding: 0.85rem 1.1rem;
    background: #f7f6f1;
    border-bottom: 1px solid var(--oc-line-soft);
}
.oc-filters label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--oc-ink-muted);
    display: block;
    margin-bottom: 0.2rem;
}
.oc-filters .form-select, .oc-filters .form-control { font-size: 0.86rem; min-width: 9.5rem; }

/* --- dugmad ---------------------------------------------------------------- */
.btn-oc-approve {
    --bs-btn-bg: var(--oc-green-700);
    --bs-btn-border-color: var(--oc-green-700);
    --bs-btn-hover-bg: var(--oc-green-800);
    --bs-btn-hover-border-color: var(--oc-green-800);
    --bs-btn-color: #fff;
    --bs-btn-hover-color: #fff;
}
.btn-oc-reject {
    --bs-btn-color: #9b1c1c;
    --bs-btn-border-color: #dfa1a1;
    --bs-btn-hover-bg: #9b1c1c;
    --bs-btn-hover-border-color: #9b1c1c;
    --bs-btn-hover-color: #fff;
}
.btn-oc-ghost {
    --bs-btn-color: var(--oc-ink-soft);
    --bs-btn-border-color: var(--oc-line);
    --bs-btn-hover-bg: #f3f4f6;
    --bs-btn-hover-color: var(--bs-body-color);
}

/* --- prazno stanje ---------------------------------------------------------- */
.oc-empty {
    text-align: center;
    padding: 2.8rem 1rem;
    color: var(--oc-ink-muted);
}
.oc-empty .bi { font-size: 2.1rem; color: var(--oc-line); display: block; margin-bottom: 0.5rem; }
.oc-empty strong { display: block; color: var(--oc-ink-soft); font-weight: 600; margin-bottom: 0.2rem; }

/* --- traka sa brojem prikazanih --------------------------------------------- */
.oc-count {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.7rem 1.1rem;
    border-top: 1px solid var(--oc-line-soft);
    font-size: 0.84rem;
    color: var(--oc-ink-muted);
    flex-wrap: wrap;
    gap: 0.6rem;
}

/* --- štampa (Архива) --------------------------------------------------------- */
.print-header { display: none; }
.print-footer { display: none; }
@media print {
    body { background: #fff !important; font-size: 11pt; color: #000; }
    .navbar, .sidebar, .sidebar-overlay, .oc-filters, .oc-tabs, .oc-count,
    .no-print, .btn, .alert, footer { display: none !important; }
    .main-content { margin: 0 !important; padding: 0 !important; }
    .oc-header { border: none; padding: 0; margin-bottom: 0.5rem; }
    .oc-card { border: none; box-shadow: none; }
    .print-header {
        display: block;
        text-align: center;
        border-bottom: 2.5px double #000;
        padding-bottom: 0.6rem;
        margin-bottom: 1rem;
    }
    .print-header .org {
        font-family: 'Cormorant Garamond', serif;
        font-size: 15pt;
        font-weight: 700;
        letter-spacing: 0.05em;
    }
    .print-header .doc-title {
        font-size: 12pt;
        font-weight: 600;
        margin-top: 0.5rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
    }
    .print-header .doc-meta { font-size: 9pt; margin-top: 0.15rem; }
    .oc-table thead th { color: #000; border-bottom: 1.5px solid #000; }
    .oc-table tbody td { border-bottom: 0.5px solid #888; }
    .oc-table tbody tr:hover { background: none; }
    .status { border: 1px solid #000 !important; background: none !important; color: #000 !important; }
    .status::before { display: none; }
    .print-footer { display: block; margin-top: 2.2rem; font-size: 9pt; }
    .print-footer .sig { margin-top: 2.6rem; display: flex; justify-content: flex-end; }
    .print-footer .sig .line {
        border-top: 1px solid #000;
        width: 220px;
        text-align: center;
        padding-top: 0.25rem;
    }
}
</style>
