# Nginx configuration for Museum Information System — DEV (192.168.144.48)
# PROD varijanta (nhmb-srv01, /opt/mis/app) je deploy/nginx_museum_prod.conf;
# obe menjaj zajedno (razlikuju se samo u server_name i putanjama).
# Place this file in /etc/nginx/sites-available/museum
# Then create a symlink: sudo ln -s /etc/nginx/sites-available/museum /etc/nginx/sites-enabled/

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=museum_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=1r/s;

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name 192.168.144.48 100.74.89.110;

    # Restrict the app to localhost, museum LAN, and Tailscale VPN.
    allow 127.0.0.1;
    allow ::1;
    allow 192.168.144.0/24;
    allow 100.64.0.0/10;      # Tailscale VPN
    deny all;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # Replace with your server IP or hostname
    server_name 192.168.144.48 100.74.89.110;

    # Restrict the app to localhost, museum LAN, and Tailscale VPN.
    allow 127.0.0.1;
    allow ::1;
    allow 192.168.144.0/24;
    allow 100.64.0.0/10;      # Tailscale VPN
    deny all;

    # SSL Configuration - update paths to your certificates
    ssl_certificate /etc/pki/tls/certs/museum_cert.pem;
    ssl_certificate_key /etc/pki/tls/private/museum_key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Hide nginx version
    server_tokens off;

    # Dynamic application responses already receive security headers from Flask-Talisman.
    # Avoid repeating those headers here; nginx keeps only per-location asset headers below.

    # Increase client body size for file uploads.
    # MORA biti >= MAX_CONTENT_LENGTH iz config.py (220 MB = 200 MB RAW po
    # fajlu + multipart zaglavlja) — manja vrednost vraća 413 pre nego što
    # Flask stigne da odgovori urednom porukom.
    client_max_body_size 230M;

    # Root directory for static files
    root /home/aleksandarlukovic/MuseumInfoSystem;

    # Logging
    access_log /var/log/nginx/museum_access.log;
    error_log /var/log/nginx/museum_error.log;

    # Static files - only serve actual static assets
    location /static {
        alias /home/aleksandarlukovic/MuseumInfoSystem/static;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # NOTE: /data directory is NOT exposed via nginx.
    # All data access goes through the Flask app with authentication.

    # Favicon
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # Robots.txt
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # Rate limit login endpoint
    location /login {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Geological map endpoints are bursty by design and must bypass generic request limits.
    location = /api/map/tile-index {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/map/elevation {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/map/tile/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/map/geological-sheet-image/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fototeka X-Accel: Flask proveri prava pa vrati X-Accel-Redirect na ove
    # INTERNE URI-je (fototeka_views.py: /_zasticeno/derivati/, /_zasticeno/raw/);
    # nginx sam strimuje fajl i oslobađa gunicorn workere. alias MORA da bude
    # jednak FOTOTEKA_MEDIA_PATH odnosno FOTOTEKA_ARHIVA_PATH iz .env.
    # FOTOTEKA_XACCEL=1 uključiti tek POSLE nginx reload-a sa ovim blokovima —
    # bez njih X-Accel vraća prazne odgovore (prazne slike).
    location ^~ /_zasticeno/derivati/ {
        internal;
        alias /home/aleksandarlukovic/MuseumInfoSystem/data/fototeka_media/;
    }

    location ^~ /_zasticeno/raw/ {
        internal;
        alias /home/aleksandarlukovic/MuseumInfoSystem/data/arhiva/;
    }

    # Main application
    location / {
        limit_req zone=museum_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts (high for 3D terrain max-res requests)
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Buffering (larger for 3D terrain JSON responses)
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 16 64k;
        proxy_busy_buffers_size 128k;
    }

    # Deny access to hidden files and sensitive paths
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(env|json|py|pyc|ini|cfg|conf|log|sql|db|sqlite)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
