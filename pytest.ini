[pytest]
# Стварна свита = test_*.py у корену репоа (+ tests/ фикстуре).
# Легаси стабла (PrirodnjackiMuzej/, localSQLtesting/, backups/…) НИСУ део
# свите: садрже скрипте без assert-а и дупликате имена модула који обарају
# колекцију. „pytest" без аргумената мора да скупи исто што и „pytest test_*.py".
testpaths = .
norecursedirs =
    .* *.egg build dist __pycache__
    venv .venv node_modules
    PrirodnjackiMuzej localSQLtesting backups
    data static templates migration exports storage logs test-results
    cypress playwright load docs docs_archive
