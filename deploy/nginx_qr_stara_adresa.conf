# nginx блок за СТАРУ адресу апликације (192.168.144.48 — данас dev машина).
#
# Одштампане QR налепнице на кутијама минералошке збирке (2025–2026) носе
#   http://192.168.144.48/qr_box/minerals/<кутија>
# јер је апликација тада радила на том серверу. Продукција је на .194, па ова
# адреса мора да преусмерава те путање докле год постоји иједна налепница.
# Кад dev машина једном оде, .48 треба да пређе продукцији као друга адреса.
#
# Инсталација на dev-у (root):
#   install -m 644 deploy/nginx_qr_stara_adresa.conf /etc/nginx/conf.d/qr-stara-adresa.conf
#   nginx -t && systemctl reload nginx
# Постојећи dev блок (nginx_museum.conf) остаје за Tailscale адресу и име;
# овај блок хвата само захтеве чији је Host тачно 192.168.144.48.
#
# Пример провере:  curl -sI http://192.168.144.48/qr_box/minerals/12 | grep -i location

server {
    listen 80;
    listen [::]:80;
    server_name 192.168.144.48;

    # Налепнице на кутијама — једини облик који је стварно одштампан.
    location ~ ^/qr_box/ {
        return 301 https://192.168.144.194$request_uri;
    }

    # Нови облик, ако неко икад одштампа налепницу док је подешавање
    # qr_bazna_adresa грешком на старој адреси.
    location ~ ^/q/ {
        return 301 https://192.168.144.194$request_uri;
    }

    # Све остало на старој LAN адреси и даље служи dev апликацију.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
